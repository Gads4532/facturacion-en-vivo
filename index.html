      type: 'bar',
      data: { labels: etq, datasets: [
        { label: 'Convenio', data: dc, backgroundColor: C.naranja, stack: 'v', barPercentage: largo > 120 ? 1 : 0.85, categoryPercentage: largo > 120 ? 1 : 0.9 },

        scales: { x: ejeX({ stacked: true }), y: ejeY(null, { stacked: true, beginAtZero: true }) } }
    });
    h += '<p class="hsub">Participación del convenio</p><p class="hexp">Qué parte de la venta de cada día fue por convenio; la línea oscura es el promedio de 7 días.</p>';
    h += lienzo(G, 170, {
      type: 'line',
      data: { labels: etq, datasets: [
        { label: 'Del día', data: dp, borderColor: alfa(C.naranja, 0.35), borderWidth: 1.5 },

      ] },

    function fila(et, a, b, ta, tb, tipo, fmt) {

        '</td><td>' + fmt(b.v) + (ant ? '<br><span class="chico ' + clsVar(b.v, b.o, tipo) + '">' + varCorta(b.v, b.o, tipo) + '</span>' : '') + '</td></tr>';

      fila('Venta', { v: act.conv.venta, o: c0.venta }, { v: act.farm.venta, o: f0.venta }, 0, 0, 'usd', function (x) { return usd(x); }) +

      fila('Ticket promedio', { v: act.conv.ticket, o: c0.ticket }, { v: act.farm.ticket, o: f0.ticket }, 0, 0, 'usd2', function (x) { return esNum(x) ? usd(x, true) : '—'; }) +
      fila('Participación', { v: act.conv.part, o: c0.part }, { v: act.farm.part, o: f0.part }, 0, 0, 'pp', function (x) { return esNum(x) ? pct(x) : '—'; }) +
      '</tbody></table></div>';
    h += '<p class="hsub">En el período</p>' + tabla;
    return tarjeta('Convenio y farmacia, por día', 'Venta diaria separada en convenio (naranja) y venta propia de la farmacia (azul)' + (ant ? '; debajo de cada cifra, su variación frente al período anterior.' : '.'), h);
  }
  function clsVar(a, b, tipo) {

  }

  function seccionMeses(G, w) {
    var P = S.prep, v = serie('venta'), fFin = P.fechas[w.b], fIni = P.fechas[w.a];
    var meses = [], ym = fFin.slice(0, 7), ymIni = fIni.slice(0, 7);
    // Meses del período (al menos 3)
    var cur = ym;
    while (true) {
      meses.unshift(cur);
      var y = +cur.slice(0, 4), m = +cur.slice(5, 7) - 1;
      if (m === 0) { y--; m = 12; }

    }

      var a = Est.difDias(P.f0, ini), b = Math.min(P.N - 1, Est.difDias(P.f0, fin));

    }

    meses.forEach(function (mx) {
      var esParcial = mx === ym && parcial;
      var actual = sumaMes(mx, esParcial ? diaFin : 0);
      var yAnt = (+mx.slice(0, 4) - 1) + mx.slice(4);
      var previo = sumaMes(yAnt, esParcial ? diaFin : 0);
      var incompleto = actual && !actual.completo;
      etq.push(mesCorto(mx) + (esParcial ? '*' : ''));
      dA.push(actual ? actual.v : null);
      dP.push(previo && previo.completo ? previo.v : null);
      filas.push({ mes: mx, v: actual ? actual.v : null, p: previo && previo.completo ? previo.v : null, parcial: esParcial, incompleto: incompleto });
    });
    var colores = filas.map(function (f) { return f.parcial || f.incompleto ? alfa(C.azul, 0.45) : C.azul; });
    var hayPrev = dP.some(function (x) { return x !== null; });
    var cfg = {
      type: 'bar',
      data: { labels: etq, datasets: [{ label: 'Este año', data: dA, backgroundColor: colores, borderRadius: 4, maxBarThickness: 26 }]
        .concat(hayPrev ? [{ label: 'Año anterior', data: dP, backgroundColor: C.gris, borderRadius: 4, maxBarThickness: 26 }] : []) },
      options: { interaction: { mode: 'index', intersect: false },
        plugins: { legend: hayPrev ? leyenda() : { display: false }, tooltip: { callbacks: {
          title: function (it) { var f = filas[it[0].dataIndex]; return MESES_L[+f.mes.slice(5, 7) - 1] + ' ' + f.mes.slice(0, 4) + (f.parcial ? ' (parcial, hasta el ' + diaFin + ')' : f.incompleto ? ' (datos incompletos)' : ''); },
          label: tipUsd,
          footer: function (it) { var f = filas[it[0].dataIndex]; return esNum(f.v) && esNum(f.p) ? 'Variación: ' + textoVar(f.v - f.p, Est.variacion(f.v, f.p).pct) : ''; } } } },
        scales: { x: ejeX({ ticks: { color: C.sec, maxRotation: 0, autoSkip: true, autoSkipPadding: 8 } }), y: ejeY(null, { beginAtZero: true }) } }
    };
    var tabla = '<div class="hscroll"><table class="htab"><thead><tr><th>Mes</th><th>Venta</th><th>Año ant.</th><th>Variación</th></tr></thead><tbody>';
    filas.slice().reverse().forEach(function (f) {
      var vr = esNum(f.v) && esNum(f.p) ? Est.variacion(f.v, f.p) : null;
      tabla += '<tr><td>' + mesCorto(f.mes) + (f.parcial ? ' <span class="chico">parcial</span>' : f.incompleto ? ' <span class="chico">incompleto</span>' : '') + '</td><td>' + (esNum(f.v) ? usd(f.v) : '—') +
        '</td><td>' + (esNum(f.p) ? usd(f.p) : '—') + '</td><td class="' + (vr ? (vr.dif >= 0 ? 'mas' : 'menos') : '') + '">' +
        (vr ? textoVar(vr.dif, null) + '<br><span class="chico ' + (vr.dif >= 0 ? 'mas' : 'menos') + '">' + (vr.pct >= 0 ? '+' : '−') + pctVar(vr.pct) + '</span>' : '—') + '</td></tr>';
    });
    tabla += '</tbody></table></div>';
    return tarjeta('Venta por mes', 'Cada mes frente al mismo mes del año anterior.' + (parcial ? ' * El mes en curso es parcial: se compara con los mismos días del año anterior.' : ''), lienzo(G, 220, cfg) + tabla);
  }

  function seccionDistribucion(G, ya) {
    if (ya.length < 5) return tarjeta('Distribución de la venta diaria', 'Hacen falta más días para calcularla.', '');
    var b = Est.basicos(ya), hi = Est.histograma(ya);

      type: 'bar',

      options: { plugins: { tooltip: { callbacks: {
        title: function (it) { var x = hi.bins[it[0].dataIndex]; return 'De ' + usd(x.desde) + ' a ' + usd(x.hasta); },
        label: function (c) { return ' ' + c.parsed.y + (c.parsed.y === 1 ? ' día' : ' días'); } } } },
        scales: { x: ejeX({ ticks: { color: C.sec, maxRotation: 0, autoSkip: true, autoSkipPadding: 10 } }), y: ejeY(function (v) { return Number.isInteger(v) ? num(v) : ''; }, { beginAtZero: true }) } }
    };

    var txC = !esNum(c) ? 'No se puede calcular.' : c > 1 ? 'Alta: hay más días extremos (muy altos o muy bajos) de lo habitual.' :
      c < -1 ? 'Baja: los días se reparten de forma pareja, con pocos extremos.' : 'Normal: los días extremos aparecen con la frecuencia habitual.';
    var lista = '<div class="hlista">' +
      it('P10', usd(b.p10), 'El 10 % de los días vendió menos que esto.') +
      it('P25', usd(b.p25), 'Una cuarta parte de los días vendió menos que esto.') +
      it('P50', usd(b.mediana), 'La mediana: la mitad de los días vendió menos y la otra mitad, más.') +
      it('P75', usd(b.p75), 'Tres de cada cuatro días vendieron menos que esto.') +
      it('P90', usd(b.p90), 'Solo el 10 % de los días superó esta cifra.') +
      it('Asimetría', esNum(a) ? num(a, 2) : '—', txA) +
      it('Curtosis', esNum(c) ? num(c, 2) : '—', txC) + '</div>';
    return tarjeta('Distribución de la venta diaria', 'Cuántos días cayeron en cada tramo de venta. Los percentiles dicen qué tan alto o bajo fue un día frente al resto.', lienzo(G, 200, cfg) + lista);
  }

  function seccionCalendario(w) {
    var P = S.prep, v = serie('venta'), i;
    var vals = [];
    for (i = w.a; i <= w.b; i++) if (v[i] > 0) vals.push(v[i]);
    var lo = Est.cuantil(vals, 0.05), hi = Est.cuantil(vals, 0.95);
    // Columnas = semanas (lunes a domingo), filas = días
    var dIni = (Est.diaSemana(P.fechas[w.a]) + 6) % 7, nSem = Math.ceil((dIni + w.b - w.a + 1) / 7);
    var CEL = 13, GAP = 2, IZQ = 26, ARR = 16, ancho = IZQ + nSem * (CEL + GAP), alto = ARR + 7 * (CEL + GAP);
    var s = '<svg width="' + ancho + '" height="' + alto + '" viewBox="0 0 ' + ancho + ' ' + alto + '" role="img" aria-label="Mapa de calor del calendario">';
    [0, 2, 4, 6].forEach(function (r) {

    });

      }
      var val = v[i], color = val === null ? '#FFFFFF' : val <= 0 ? '#E5E7EB' : colorSecuencial(hi > lo ? (val - lo) / (hi - lo) : 0.5);
      var t = fechaLarga(f) + ': ' + (val === null ? 'sin datos' : val <= 0 ? 'sin ventas' : usd(val));
      s += '<rect data-i="' + i + '" data-t="' + esc(t) + '" x="' + x + '" y="' + y + '" width="' + CEL + '" height="' + CEL + '" rx="3" fill="' + color + '"' +

  function filaBarra(et, val, maxAbs, color, sub, signo) {

  }

  function seccionDescomposicion(w, act, ant) {
    if (!ant) return tarjeta('De dónde vino la variación', 'Elija 30 días, 90 días o 12 meses: se necesita un período anterior completo para comparar.', '');

      filaBarra('Por tráfico (cantidad de tickets)', d.efectoTrafico, mx, col(d.efectoTrafico), 'Los tickets variaron ' + pv(vT), true) +
      filaBarra('Por ticket promedio (gasto por compra)', d.efectoTicket, mx, col(d.efectoTicket), 'El ticket promedio varió ' + pv(vA), true) + '</div>';
    var dc = act.conv.venta - ant.conv.venta, df = act.farm.venta - ant.farm.venta, mx2 = Math.max(Math.abs(dc), Math.abs(df), Math.abs(d.dV));

      filaBarra('Convenio', dc, mx2, col(dc), usd(ant.conv.venta) + ' → ' + usd(act.conv.venta) + ' (' + pv(Est.variacion(act.conv.venta, ant.conv.venta).pct) + ')', true) +
      filaBarra('Farmacia', df, mx2, col(df), usd(ant.farm.venta) + ' → ' + usd(act.farm.venta) + ' (' + pv(Est.variacion(act.farm.venta, ant.farm.venta).pct) + ')', true) + '</div>';
    return tarjeta('De dónde vino la variación', 'Cuánto del cambio frente al período anterior se debe a más o menos clientes (tickets) y cuánto a lo que gastó cada uno. Se reparte con logaritmos para que las partes sumen el total.', cuerpo);
  }

  /* ============================== SUCURSALES ============================== */

  function datosSucursales(w) {
    var P = S.prep, filas = [], total = 0, totalAnt = 0;
    Object.keys(P.suc).forEach(function (id) {
      var s = serie('suc', id), tk = P.sucTk[id];
      var venta = sumaRango(s, w.a, w.b);
      var ventaAnt = w.ant ? sumaRango(s, w.ant.a, w.ant.b) : null;
      if (!(venta > 0) && !(ventaAnt > 0)) return;
      var vals = [], xs = [], ys = [], i;
      for (i = w.a; i <= w.b; i++) { vals.push(s[i]); if (s[i] > 0) { xs.push(i - w.a); ys.push(s[i]); } }
      var bs = Est.basicos(ys), rl = ys.length >= 7 ? Est.regresionLineal(xs, ys) : null;
      var mm = Est.mediaMovil(s.map(function (x) { return x > 0 ? x : null; }), 7, false, 0.7).slice(w.a, w.b + 1);
      var tks = sumaRango(tk, w.a, w.b);
      filas.push({ id: id, nombre: P.nombres[id], venta: venta, ant: ventaAnt, tk: tks, ticket: tks ? venta / tks : null,
        cv: bs.cv !== null ? bs.cv * 100 : null, tend: rl && bs.media ? rl.pendiente / bs.media * 100 : null,
        nueva: !!w.ant && venta > 0 && P.primera[id] > w.ant.a, mm: mm, vals: vals });
      total += venta; totalAnt += ventaAnt || 0;
    });
    filas.forEach(function (f) {
      f.part = total ? f.venta / total * 100 : 0;
      var v = w.ant && !f.nueva ? Est.variacion(f.venta, f.ant) : { dif: null, pct: null };
      f.dif = v.dif; f.pct = v.pct;
    });
    return { filas: filas, total: total, totalAnt: totalAnt };
  }

  function vistaSucursales(G) {
    var P = S.prep, w = ventana(), D = datosSucursales(w), h = controles(w);
    var filas = D.filas.filter(function (f) { return f.venta > 0; });
    if (!filas.length) return h + tarjeta('Sucursales', 'No hay ventas por sucursal en el período.', '');
    var o = S.orden;
    filas.sort(function (a, b) {
      var x = a[o.col], y = b[o.col];

    /* 1. Tabla */
    function th(col, txt, izq) {

    }
    var t = '<div class="hscroll"><table class="htab suc"><thead><tr>' + th('nombre', 'Sucursal', true) + th('venta', 'Venta') + th('part', 'Part.') +
      th('pct', 'Var. vs anterior') + th('ticket', 'Ticket') + th('cv', 'CV') + th('tend', 'Tend.') + '<th>Media 7 d</th></tr></thead><tbody>';
    filas.forEach(function (f) {
      var varTxt = f.nueva ? '<span class="hchip nueva">nueva</span>' : esNum(f.dif) ?
        '<span class="' + (f.dif >= 0 ? 'mas' : 'menos') + '">' + textoVar(f.dif, f.pct) + '</span>' : '<span class="chico">—</span>';
      t += '<tr data-accion="suc" data-id="' + esc(f.id) + '" class="' + (f.id === S.sucSel ? 'sel' : '') + '"><td><b>' + esc(f.nombre) + '</b></td><td>' + usd(f.venta) + '</td><td>' + pct(f.part) + '</td><td>' + varTxt +
        '</td><td>' + (esNum(f.ticket) ? usd(f.ticket, true) : '—') + '</td><td>' + (esNum(f.cv) ? pct(f.cv, 0) : '—') + '</td><td class="' + (esNum(f.tend) ? (f.tend >= 0 ? 'chico mas' : 'chico menos') : '') + '">' +
        (esNum(f.tend) ? (f.tend >= 0 ? '+' : '−') + num(Math.abs(f.tend), 2) + ' %/día' : '—') + '</td><td class="spark">' + sparkline(f.mm, 84, 24) + '</td></tr>';
    });
    t += '</tbody></table></div>';
    h += tarjeta('Sucursales en el período', 'Toque un encabezado para ordenar y una sucursal para ver su detalle. CV: cuánto varía su venta de un día a otro (menos es más estable). Tend.: cuánto crece o cae por día, en % de su promedio.' +
      (S.iva ? '' : ' Sin IVA: estimado con la proporción de cada día.'), t);

    /* 2. Pareto y HHI */
    var porVenta = filas.slice().sort(function (a, b) { return b.venta - a.venta; });
    var pa = Est.pareto(porVenta.map(function (f) { return f.venta; })), hh = Est.hhi(porVenta.map(function (f) { return f.venta; }));
    var nombresP = pa.orden.map(function (i) { return porVenta[i].nombre; });
    var partP = pa.orden.map(function (i) { return porVenta[i].part; });
    var acumP = pa.acumulado.map(function (x) { return x * 100; });
    var nivel = hh === null ? '' : hh < 1500 ? 'baja' : hh < 2500 ? 'moderada' : 'alta';
    var txtP = '<p class="hnota"><b>' + pa.n80 + ' de ' + porVenta.length + '</b> sucursales hacen el 80 % de la venta. ' +
      (hh !== null ? 'Índice de concentración (HHI): <b>' + num(hh) + '</b>, concentración ' + nivel + '. Equivale a tener ' + num(10000 / hh, 1) +

    h += tarjeta('Concentración de la venta (Pareto)', 'Participación de cada sucursal, de mayor a menor, y la suma acumulada.',
      lienzo(G, Math.max(180, porVenta.length * (nombresP.some(function (n) { return n.length > 15; }) ? 30 : 24) + 50), {
        type: 'bar',
        data: { labels: nombresP, datasets: [
          { label: 'Participación', data: partP, backgroundColor: alfa(C.azul, 0.85), borderRadius: 4, barPercentage: 0.8, order: 2 },
          { label: 'Acumulado', type: 'line', data: acumP, borderColor: C.naranja, backgroundColor: C.naranja, pointRadius: 2.5, order: 1 }
        ] },
        options: { indexAxis: 'y', interaction: { mode: 'index', intersect: false, axis: 'y' },
          plugins: { legend: leyenda(), tooltip: { callbacks: { label: function (c) { return ' ' + c.dataset.label + ': ' + pct(c.parsed.x); } } } },
          scales: { y: { grid: { display: false }, border: { color: C.borde }, ticks: { color: C.tinta, autoSkip: false, font: { size: 11 },
            callback: function (v, i) { return dosLineas(nombresP[i] || '', 15); } } },
            x: { min: 0, max: 100, grid: { color: C.rejilla, drawTicks: false }, border: { display: false }, ticks: { color: C.sec, stepSize: 25, callback: function (v) { return v + ' %'; } } } } }
      }) + txtP);

    /* 3. Mismas tiendas */
    if (w.ant) {
      var mismas = D.filas.filter(function (f) { return f.venta > 0 && f.ant > 0 && !f.nueva; });
      var m1 = 0, m0 = 0;
      mismas.forEach(function (f) { m1 += f.venta; m0 += f.ant; });
      var vm = Est.variacion(m1, m0), vt = Est.variacion(D.total, D.totalAnt), mx = Math.max(Math.abs(vm.dif), Math.abs(vt.dif));
      var nuevas = D.filas.filter(function (f) { return f.nueva; });
      var aporte = 0; nuevas.forEach(function (f) { aporte += f.venta; });
      var cerradas = D.filas.filter(function (f) { return !(f.venta > 0) && f.ant > 0; });
      var col = function (x) { return x >= 0 ? C.verde : C.rojo; };
      var cuerpo = '<div class="hlista" style="margin-top:6px">' +
        filaBarra('Mismas tiendas (' + mismas.length + ')', vm.dif, mx, col(vm.dif), 'Crecimiento ' + (vm.pct !== null ? (vm.pct >= 0 ? '+' : '−') + num(Math.abs(vm.pct), 1) + ' %' : '—'), true) +
        filaBarra('Total de la empresa (' + D.filas.filter(function (f) { return f.venta > 0; }).length + ')', vt.dif, mx, col(vt.dif), 'Crecimiento ' + (vt.pct !== null ? (vt.pct >= 0 ? '+' : '−') + num(Math.abs(vt.pct), 1) + ' %' : '—'), true) +
        '</div><p class="hnota">' + (nuevas.length ? 'Las sucursales nuevas (' + nuevas.map(function (f) { return esc(f.nombre); }).join(', ') + ') aportaron ' + usd(aporte) + '.' : 'No hubo sucursales nuevas en el período.') +
        (cerradas.length ? ' Sin ventas en este período: ' + cerradas.map(function (f) { return esc(f.nombre); }).join(', ') + '.' : '') + '</p>';
      h += tarjeta('Mismas tiendas', 'Crecimiento contando solo las sucursales que vendieron durante todo el período anterior y el actual, frente al crecimiento total (que incluye las aperturas).', cuerpo);
    } else {
      h += tarjeta('Mismas tiendas', 'Elija 30 días, 90 días o 12 meses: se necesita un período anterior completo para comparar.', '');
    }

    /* 4. Matriz de correlación */
    h += seccionCorrelacion(porVenta, w);

    /* 5. Detalle */
    h += seccionDetalle(G, w, filas);
    return h;
  }

  function seccionCorrelacion(porVenta, w) {
    var lista = porVenta.filter(function (f) { return f.vals.filter(function (x) { return x > 0; }).length >= 10; });
    if (lista.length < 2) return tarjeta('Correlación entre sucursales', 'Hacen falta al menos dos sucursales con 10 días de ventas en el período.', '');
    var series = lista.map(function (f) { return f.vals.map(function (x) { return x > 0 ? x : null; }); });
    var M = Est.correlacionMatriz(series), k = lista.length;
    var vista = document.getElementById('vistaHist');
    var disponible = Math.max(280, Math.min(484, (vista && vista.clientWidth ? vista.clientWidth : 360) - 36));
    // El margen izquierdo se ajusta al nombre más largo (hasta 20 letras), para no cortar los nombres habituales.
    var etiquetas = lista.map(function (f, i) { var n = f.nombre; return (i + 1) + ' ' + (n.length > 20 ? n.slice(0, 19) + '…' : n); });
    var largoMax = Math.max.apply(null, etiquetas.map(function (t) { return t.length; }));
    var IZQ = Math.max(80, Math.min(128, Math.round(largoMax * 5.5) + 8)), ARR = 18, cel = Math.max(12, Math.min(30, Math.floor((disponible - IZQ) / k)));
    var ancho = IZQ + k * cel, alto = ARR + k * cel;
    var s = '<svg width="' + ancho + '" height="' + alto + '" viewBox="0 0 ' + ancho + ' ' + alto + '" role="img" aria-label="Matriz de correlación">';
    for (var j = 0; j < k; j++) s += '<text x="' + (IZQ + j * cel + cel / 2) + '" y="12" font-size="10" text-anchor="middle" fill="' + C.sec + '">' + (j + 1) + '</text>';
    for (var i = 0; i < k; i++) {
      s += '<text x="0" y="' + (ARR + i * cel + cel / 2 + 3.5) + '" font-size="10" fill="' + C.tinta + '">' + esc(etiquetas[i]) + '</text>';
      for (j = 0; j < k; j++) {
        var r = M[i][j], t = lista[i].nombre + ' y ' + lista[j].nombre + ': ' + (esNum(r) ? 'r = ' + num(r, 2) : 'sin días comunes suficientes');
        s += '<rect data-i="' + i + '" data-t="' + esc(t) + '" x="' + (IZQ + j * cel + 0.5) + '" y="' + (ARR + i * cel + 0.5) + '" width="' + (cel - 1) + '" height="' + (cel - 1) + '" rx="2" fill="' + colorDivergente(r) + '"><title>' + esc(t) + '</title></rect>';
      }
    }
    s += '</svg>';
    var ley = '<div class="hleyenda">−1 <i class="grad" style="background:linear-gradient(90deg,' + colorDivergente(-1) + ',' + colorDivergente(0) + ',' + colorDivergente(1) + ')"></i> +1</div>';
    return tarjeta('Correlación entre sucursales', 'Qué tanto suben y bajan juntas las ventas diarias de cada par (azul: se mueven juntas; naranja: en sentido contrario). Toque un cuadro para ver el valor.',
      '<div class="hmat" data-info="hmatInfo">' + s + '</div>' + ley + '<div class="hinfo" id="hmatInfo"></div>' +
      '<p class="hnota">Parte del parecido se debe al patrón semanal común (todas venden menos el domingo).</p>');
  }

  function seccionDetalle(G, w, filas) {
    var P = S.prep, id = S.sucSel, s = serie('suc', id), nombre = P.nombres[id];
    var sel = '<select class="hsel" id="hselSuc" aria-label="Sucursal">' + filas.slice().sort(function (a, b) { return a.nombre.localeCompare(b.nombre, 'es'); }).map(function (f) {

    atip.forEach(function (x) { porI[x.i] = x; });

    for (i = w.a; i <= w.b; i++) {
      dV.push(s[i]); d7.push(mm7[i]); d28.push(mm28[i]); dA.push(porI[i] ? s[i] : null);
      if (ab[i] !== null) { fa.push(P.fechas[i]); ya.push(ab[i]); }
    }
    var cuerpo = sel + lienzo(G, 230, {
      type: 'line',
      data: { labels: etq, datasets: [
        { label: 'Venta diaria', data: dV, borderColor: alfa(C.azul, 0.35), borderWidth: 1.5, order: 3 },

      ] },

      type: 'bar',
      data: { labels: ORDEN_SEM.map(function (d) { return DSEM_C[d]; }), datasets: [{ label: 'Venta media', data: pm, backgroundColor: alfa(C.azul, 0.85), borderRadius: 6, maxBarThickness: 30 }] },
      options: { plugins: { tooltip: { callbacks: {
        title: function (it) { return DSEM[ORDEN_SEM[it[0].dataIndex]]; },
        label: function (c) { var j = c.dataIndex; return [' Media: ' + usd(pm[j]), ' Mitad central: ' + usd(plo[j]) + ' a ' + usd(phi[j])]; } } } },
        scales: { x: ejeSemana(), y: ejeY(null, { beginAtZero: true }) } },
      plugins: [pluginBigotes(plo, phi)]
    });
    var enPeriodo = atip.filter(function (x) { return x.i >= w.a && x.i <= w.b; }).slice(-6).reverse();

      cuerpo += '<div class="hscroll"><table class="htab"><thead><tr><th>Fecha</th><th>Venta</th><th>Esperado</th><th>Diferencia</th></tr></thead><tbody>' +
        enPeriodo.map(function (x) {

        }).join('') + '</tbody></table></div>';

    return tarjeta('Detalle: ' + esc(nombre), 'Venta diaria de la sucursal con sus medias de 7 y 28 días; en rojo, los días que se apartan mucho de lo esperado.', cuerpo, ' id="hdetalle"');
  }

  /* ============================== PRONÓSTICO ============================== */

  function modelo() {
    // Siempre con IVA y con todo el histórico (sin selector).
    var k = 'modelo|' + (S.hoy ? S.hoy.hoy : '');
    if (S.cache[k]) return S.cache[k];
    var P = S.prep, y = P.v.map(function (x) { return x > 0 ? x : null; });
    var hoyF = S.hoy && S.hoy.hoy && S.hoy.hoy > P.f1 ? S.hoy.hoy : Est.sumarDias(P.f1, 1);
    var fin = finDeMes(hoyF), H = Math.max(14, Est.difDias(P.f1, fin));
    var M = {
      y: y, hoyF: hoyF, fin: fin, H: H,
      hw: Est.holtWinters(y, { m: 7, h: H, validacion: 28 }),
      rl: null, ts: null, acf: null, atip: null, cambio: null
    };
    var xs = [], ys = [], fs = [];
    for (var i = 0; i < P.N; i++) if (y[i] !== null) { xs.push(i); ys.push(y[i]); fs.push(P.fechas[i]); }
    M.rl = Est.regresionLineal(xs, ys);
    M.media = Est.media(ys);
    M.ts = Est.tendenciaConSemana(fs, ys);
    M.acf = Est.acf(ys, 28);
    M.atip = Est.atipicos(P.fechas, y);
    M.cambio = Est.puntoCambio(P.fechas, y);
    S.cache[k] = M;
    return M;
  }

  function vistaPronostico(G) {
    var P = S.prep, M = modelo(), h = '', i, k;
    if (P.N < 30) {
      return tarjeta('Pronóstico', 'Hacen falta al menos 30 días de historia para pronosticar. Hoy hay ' + P.N + '.', '');
    }
    var hw = M.hw, fc = hw ? hw.pronostico : null;
    function fechaH(k) { return Est.sumarDias(P.f1, k); }
    if (!hw) {
      h += tarjeta('Pronóstico', 'No fue posible ajustar el modelo de pronóstico con los datos disponibles, por lo que no se muestran la proyección del mes ni el pronóstico de 14 días. El resto del análisis sí está disponible.', '');
    } else {

    /* 1. Proyección del cierre del mes */
    var mesYM = M.hoyF.slice(0, 7), iniMes = mesYM + '-01';
    var aMes = Math.max(0, Est.difDias(P.f0, iniMes));
    var vendHist = Est.difDias(P.f0, iniMes) <= P.N - 1 ? sumaRango(P.v, aMes, P.N - 1) : 0;
    var vivo = S.hoy && S.hoy.hoy === M.hoyF && esNum(+S.hoy.venta) ? +S.hoy.venta : 0;
    var dias = [], acumulado = [];
    for (k = 1; k <= hw.pronostico.length; k++) {
      var f = fechaH(k);
      if (f < iniMes || f > M.fin) continue;
      var p = fc[k - 1];
      if (f === M.hoyF && vivo > 0) {
        var resto = Math.max(0, p.valor - vivo), fr = p.valor > 0 ? resto / p.valor : 0;
        // De hoy solo falta una parte: su error pesa en la misma proporción (peso = fr).
        dias.push({ f: f, h: k, peso: fr, valor: resto, lo80: p.valor - (p.valor - p.lo80) * fr - (p.valor - resto), hi80: resto + (p.hi80 - p.valor) * fr,
          lo95: resto - (p.valor - p.lo95) * fr, hi95: resto + (p.hi95 - p.valor) * fr, total: Math.max(p.valor, vivo) });
      } else dias.push({ f: f, h: k, peso: 1, valor: p.valor, lo80: p.lo80, hi80: p.hi80, lo95: p.lo95, hi95: p.hi95, total: p.valor });
    }
    // Rango del cierre: varianza de la suma con la fórmula del modelo (los errores de días seguidos van juntos).
    var pry = Est.proyeccionMes({ vendido: vendHist + vivo, pronosticoDias: dias, modelo: hw });
    var mesAnt = Est.sumarDias(iniMes, -1).slice(0, 7);
    function totalMes(ym) {
      var a = Est.difDias(P.f0, ym + '-01'), b = Est.difDias(P.f0, finDeMes(ym + '-01'));
      if (a < 0 || b > P.N - 1 || !cubierto(a, b)) return null;
      return sumaRango(P.v, a, b);
    }
    var tAnt = totalMes(mesAnt), anioAnt = (+mesYM.slice(0, 4) - 1) + mesYM.slice(4), tAnio = totalMes(anioAnt);
    var nombreMes = MESES_L[+mesYM.slice(5, 7) - 1];
    var cuerpo = '<div class="hgrande2">' + usd(pry.total) + '</div>' +
      '<div class="hrango">Rango probable (80 %): ' + usd(pry.lo80) + ' a ' + usd(pry.hi80) + '<br>Rango amplio (95 %): ' + usd(pry.lo95) + ' a ' + usd(pry.hi95) + '</div>' +
      '<div class="hcomp" style="margin-top:10px"><span>Vendido hasta ahora' + (vivo ? ' (incluye hoy en vivo)' : '') + '</span><b>' + usd(pry.vendido) + '</b></div>' +
      '<div class="hcomp"><span>Pronóstico de los días que faltan</span><b>' + usd(pry.resto) + '</b></div>' +
      '<div class="hcomp"><span>Frente a ' + MESES_L[+mesAnt.slice(5, 7) - 1] + ' completo' + (tAnt !== null ? ' (' + usd(tAnt) + ')' : '') + '</span>' + (tAnt !== null ? chip(pry.total, tAnt) : '<span class="hchip">sin datos</span>') + '</div>' +
      '<div class="hcomp"><span>Frente a ' + nombreMes + ' ' + anioAnt.slice(0, 4) + (tAnio !== null ? ' (' + usd(tAnio) + ')' : '') + '</span>' + (tAnio !== null ? chip(pry.total, tAnio) : '<span class="hchip">sin datos</span>') + '</div>';
    // Gráfica del acumulado del mes
    var nDias = +M.fin.slice(8, 10), etqM = [], real = [], proy = [], b80lo = [], b80hi = [], prevAc = [];
    var acum = 0, pesosAc = [], porFecha = {}, z80 = Est.normInv(0.9);
    dias.forEach(function (d) { porFecha[d.f] = d; });
    var aAnt = Est.difDias(P.f0, mesAnt + '-01'), acAnt = 0;
    for (var dm = 1; dm <= nDias; dm++) {
      var fd = mesYM + '-' + (dm < 10 ? '0' : '') + dm, j = Est.difDias(P.f0, fd);
      etqM.push(String(dm));
      var ja = aAnt + dm - 1;
      if (tAnt !== null && dm <= +finDeMes(mesAnt + '-01').slice(8, 10)) { acAnt += P.v[ja] || 0; prevAc.push(acAnt); } else prevAc.push(null);
      if (j >= 0 && j <= P.N - 1) { acum += P.v[j] || 0; real.push(acum); proy.push(null); b80lo.push(null); b80hi.push(null); continue; }
      if (fd === M.hoyF && vivo > 0) { real.push(acum + vivo); }
      else real.push(null);
      var d = porFecha[fd];
      if (!d) { proy.push(null); b80lo.push(null); b80hi.push(null); continue; }
      if (proy.every(function (x) { return x === null; })) { // une la proyección con el último real
        var ult = proy.length - 1;
        if (ult >= 0 && real[ult] !== null) { proy[ult] = real[ult]; b80lo[ult] = real[ult]; b80hi[ult] = real[ult]; }
      }
      acum += (fd === M.hoyF ? vivo : 0) + d.valor;
      while (pesosAc.length < d.h) pesosAc.push(0);
      pesosAc[d.h - 1] = d.peso;
      var sdAc = Math.sqrt(hw.varSuma(pesosAc));
      proy.push(acum); b80lo.push(Math.max(acum - z80 * sdAc, 0)); b80hi.push(acum + z80 * sdAc);
    }
    cuerpo += lienzo(G, 220, {
      type: 'line',
      data: { labels: etqM, datasets: [
        { label: '_alto', data: b80hi, borderWidth: 0, pointRadius: 0, fill: false },
        { label: 'Rango 80 %', data: b80lo, borderWidth: 0, pointRadius: 0, backgroundColor: alfa(C.azul, 0.14), fill: '-1' },
        { label: 'Vendido', data: real, borderColor: C.azul, backgroundColor: C.azul },
        { label: 'Proyección', data: proy, borderColor: C.azul, borderDash: [5, 4], backgroundColor: C.azul },
        { label: MESES_L[+mesAnt.slice(5, 7) - 1] + ' (referencia)', data: prevAc, borderColor: C.gris, backgroundColor: C.gris, borderWidth: 1.5 }
      ] },
      options: { interaction: { mode: 'index', intersect: false },
        plugins: { legend: leyenda(), tooltip: { filter: function (c) { return c.datasetIndex >= 2 && c.parsed.y !== null; }, callbacks: {
          title: function (it) { return 'Día ' + it[0].label; }, label: tipUsd } } },
        scales: { x: ejeX(), y: ejeY(null, { beginAtZero: true }) } }
    });
    h += tarjeta('Cierre estimado de ' + nombreMes, 'Lo vendido en el mes más el pronóstico de los días que faltan. El rango del 80 % es el más probable; el del 95 % es casi seguro.', cuerpo, ' class="ht hres"');

    /* 2. Pronóstico de 14 días */
    var ver = 42, a = Math.max(0, P.N - ver), etq = [], dReal = [], dFc = [], lo80 = [], hi80 = [], lo95 = [], hi95 = [];
    for (i = a; i < P.N; i++) {
      etq.push(fechaDM(P.fechas[i])); dReal.push(P.v[i]);
      var last = i === P.N - 1;
      dFc.push(last ? P.v[i] : null); lo80.push(last ? P.v[i] : null); hi80.push(last ? P.v[i] : null); lo95.push(last ? P.v[i] : null); hi95.push(last ? P.v[i] : null);
    }
    for (k = 1; k <= 14; k++) {
      var q = fc[k - 1];
      etq.push(fechaDM(fechaH(k))); dReal.push(null); dFc.push(q.valor); lo80.push(q.lo80); hi80.push(q.hi80); lo95.push(q.lo95); hi95.push(q.hi95);
    }
    var nReal = P.N - a;
    var tabla = '<div class="hscroll"><table class="htab"><thead><tr><th>Día</th><th>Pronóstico</th><th>Rango 80 %</th><th>Rango 95 %</th></tr></thead><tbody>';
    for (k = 1; k <= 14; k++) {
      var z = fc[k - 1], fz = fechaH(k);
      tabla += '<tr><td>' + DSEM_C[Est.diaSemana(fz)] + ' ' + fechaDM(fz) + '</td><td><b>' + usd(z.valor) + '</b></td><td>' + rangoCorto(z.lo80, z.hi80) + '</td><td>' + rangoCorto(z.lo95, z.hi95) + '</td></tr>';
    }
    tabla += '</tbody></table></div>';
    var mult = hw.modelo === 'multiplicativo';
    var expModelo = '<p class="hnota">Modelo elegido: <b>Holt-Winters ' + hw.modelo + '</b> (' + (mult ? 'el patrón semanal crece con la venta' : 'el patrón semanal suma montos fijos') + '), ' +
      'con error típico de un día (RMSE) de ' + usd(hw.rmse) + (hw.rmseAditivo !== null && hw.rmseMultiplicativo !== null ? ' frente a ' + usd(mult ? hw.rmseAditivo : hw.rmseMultiplicativo) + ' del ' + (mult ? 'aditivo' : 'multiplicativo') : '') + '. ' +
      'Parámetros: α = ' + num(hw.alfa, 2) + ' (peso de lo reciente en el nivel), β = ' + num(hw.beta, 2) + ' (tendencia), γ = ' + num(hw.gamma, 2) + ' (patrón semanal).' +
      (esNum(hw.mape28) ? ' Prueba con los últimos 28 días (sin usarlos para ajustar): el pronóstico se desvió en promedio un <b>' + num(hw.mape28, 1) + ' %</b> de la venta real (MAPE).' : '') + '</p>';
    h += tarjeta('Pronóstico de 14 días', 'Venta diaria esperada con su rango probable (80 %) y amplio (95 %); el rango se ensancha mientras más lejano es el día.',
      lienzo(G, 240, {
        type: 'line',
        data: { labels: etq, datasets: [
          { label: '_95a', data: hi95, borderWidth: 0, pointRadius: 0, fill: false },
          { label: 'Rango 95 %', data: lo95, borderWidth: 0, pointRadius: 0, backgroundColor: alfa(C.naranja, 0.12), fill: '-1' },
          { label: '_80a', data: hi80, borderWidth: 0, pointRadius: 0, fill: false },
          { label: 'Rango 80 %', data: lo80, borderWidth: 0, pointRadius: 0, backgroundColor: alfa(C.naranja, 0.22), fill: '-1' },
          { label: 'Venta real', data: dReal, borderColor: C.azul, backgroundColor: C.azul },
          { label: 'Pronóstico', data: dFc, borderColor: C.naranja, backgroundColor: C.naranja }
        ] },
        options: { interaction: { mode: 'index', intersect: false },
          plugins: { legend: leyenda(), tooltip: { filter: function (c) { return (c.datasetIndex >= 4 && c.parsed.y !== null) && !(c.datasetIndex === 5 && c.dataIndex < nReal); }, callbacks: {
            title: function (it) { var j = it[0].dataIndex; var f = j < nReal ? P.fechas[a + j] : fechaH(j - nReal + 1); return fechaLarga(f); },
            label: tipUsd,
            footer: function (it) { var j = it[0].dataIndex - nReal; if (j < 0) return ''; var z = fc[j]; return 'Rango 80 %: ' + usd(z.lo80) + ' a ' + usd(z.hi80) + '\nRango 95 %: ' + usd(z.lo95) + ' a ' + usd(z.hi95); } } } },
          scales: { x: ejeX(), y: ejeY(null, { beginAtZero: true }) } }
      }) + expModelo + tabla);
    } // fin de las secciones que necesitan el modelo

    /* 3. Tendencia */
    var rl = M.rl, ts = M.ts;
    if (rl) {
      var porMes = rl.pendiente * 30.4375 / M.media * 100;
      var etqT = [], dT = [], dL = [], dN = [];
      var c = M.cambio;
      for (i = 0; i < P.N; i++) {
        etqT.push(fechaDM(P.fechas[i]) + '/' + P.fechas[i].slice(2, 4));
        dT.push(M.y[i]); dL.push(rl.intercepto + rl.pendiente * i);
        dN.push(c && c.hay && c.nivel ? c.nivel[i] : null);
      }
      function pTxt(p) { return !esNum(p) ? '—' : p < 0.001 ? 'p < 0,001' : 'p = ' + num(p, 3); }
      var efectos = '';
      if (ts) {
        efectos = '<div class="hdias">' + ORDEN_SEM.map(function (d) {
          var e = ts.efectoDia[d];
          var t = num(Math.abs(e) / 1000, 1); // en miles de dólares, para que quepan los 7 días a 360 px
          return '<div>' + DSEM_C[d] + '<b>' + (esNum(e) ? (e >= 0 ? '+' : '−') + t : '—') + '</b></div>';
        }).join('') + '</div>';
      }
      var cuerpoT = lienzo(G, 230, {
        type: 'line',
        data: { labels: etqT, datasets: [
          { label: 'Venta diaria', data: dT, borderColor: alfa(C.azul, 0.3), borderWidth: 1.2 },
          { label: 'Tendencia (MCO)', data: dL, borderColor: C.naranja },
          { label: 'Nivel con el cambio', data: dN, borderColor: C.agua, spanGaps: true, hidden: !(c && c.hay) }
        ].filter(function (d) { return !(d.label === 'Nivel con el cambio' && !(c && c.hay)); }) },
        options: { interaction: { mode: 'index', intersect: false },
          plugins: { legend: leyenda(), tooltip: { callbacks: { title: function (it) { return fechaLarga(P.fechas[it[0].dataIndex]); }, label: function (x) { return x.parsed.y === null ? null : tipUsd(x); } } } },
          scales: { x: ejeX(), y: ejeY(null, { beginAtZero: true }) } }
      });
      cuerpoT += '<div class="hlista">' +
        '<div class="it"><div class="k">Pendiente<b>' + (rl.pendiente >= 0 ? '+' : '−') + usd(Math.abs(rl.pendiente)) + '/día</b></div><div class="x">La venta diaria sube en promedio ' + usd(Math.abs(rl.pendiente), true) + ' cada día (' + (porMes >= 0 ? '+' : '−') + num(Math.abs(porMes), 1) + ' % por mes). Intervalo del 95 %: ' + usd(rl.ic95[0], true) + ' a ' + usd(rl.ic95[1], true) + ' por día.</div></div>' +
        '<div class="it"><div class="k">R²<b>' + num(rl.r2, 2) + '</b></div><div class="x">El ' + num(rl.r2 * 100) + ' % de los cambios de la venta diaria se explica solo por el paso del tiempo.</div></div>' +
        '<div class="it"><div class="k">Valor p<b>' + pTxt(rl.p).replace('p ', '') + '</b></div><div class="x">Probabilidad de ver una tendencia así por azar si en realidad no la hubiera. Por debajo de 0,05 la tendencia es real.</div></div>';
      if (ts) {
        cuerpoT += '<div class="it"><div class="k">Sin el efecto semanal<b>' + (ts.pendienteDia >= 0 ? '+' : '−') + usd(Math.abs(ts.pendienteDia)) + '/día</b></div><div class="x">Regresión múltiple que separa la tendencia del día de la semana. Intervalo del 95 %: ' +
          usd(ts.ic95[0], true) + ' a ' + usd(ts.ic95[1], true) + '; R² = ' + num(ts.r2, 2) + ' (' + pTxt(ts.p) + ').</div></div>';
      }
      cuerpoT += '</div>';
      if (ts) cuerpoT += '<p class="hsub">Efecto de cada día de la semana</p><p class="hexp">Cuánto vende cada día por encima o por debajo de un día promedio, ya descontada la tendencia, en miles de dólares.</p>' + efectos;
      h += tarjeta('Tendencia', 'Recta que mejor resume la venta diaria a lo largo del tiempo (mínimos cuadrados).', cuerpoT);
    }

    /* 4. Autocorrelación */
    if (M.acf && M.acf.valores.length) {
      var av = M.acf.valores, banda = M.acf.banda, r7 = av[6], r1 = av[0];
      var etqA = av.map(function (x, j) { return String(j + 1); });
      h += tarjeta('Autocorrelación', esNum(r7) && r7 > banda ?
        'La venta de un día se parece a la de hace 7 días (r = ' + num(r7, 2) + '): el patrón semanal se repite.' :
        'Qué tanto se parece la venta de un día a la de días anteriores.',
        lienzo(G, 200, {
          type: 'bar',
          data: { labels: etqA, datasets: [
            { label: 'Autocorrelación', data: av, backgroundColor: av.map(function (x, j) { return (j + 1) % 7 === 0 ? C.azul : alfa(C.azul, 0.45); }), borderRadius: 2, order: 2 },
            { label: 'Límite de significancia', type: 'line', data: av.map(function () { return banda; }), borderColor: C.gris, borderDash: [4, 4], borderWidth: 1.5, order: 1 },
            { label: '_lim', type: 'line', data: av.map(function () { return -banda; }), borderColor: C.gris, borderDash: [4, 4], borderWidth: 1.5, order: 1 }
          ] },
          options: { interaction: { mode: 'index', intersect: false },
            plugins: { legend: leyenda(), tooltip: { filter: function (c) { return c.datasetIndex === 0; }, callbacks: {
              title: function (it) { var l = +it[0].label; return 'Hace ' + l + (l === 1 ? ' día' : ' días'); },
              label: function (c) { return ' r = ' + num(c.parsed.y, 2); } } } },
            scales: { x: ejeX({ title: { display: true, text: 'Días de diferencia', color: C.sec, font: { size: 11 } } }), y: ejeY(function (v) { return num(v, 1); }, { min: -1, max: 1 }) } }
        }) + '<p class="hnota">Las barras fuera de las líneas punteadas (±' + num(banda, 2) + ') indican un parecido que no es casualidad. Ayer y hoy: r = ' + num(r1, 2) + '.</p>');
    }

    /* 5. Días atípicos */
    var ult = M.atip.slice(-10).reverse();
    var tAt = ult.length ? '<div class="hscroll"><table class="htab"><thead><tr><th>Fecha</th><th>Venta</th><th>Esperado</th><th>Diferencia</th></tr></thead><tbody>' +
      ult.map(function (x) {
        return '<tr><td>' + DSEM_C[Est.diaSemana(x.fecha)] + ' ' + fechaDM(x.fecha) + '/' + x.fecha.slice(2, 4) + '</td><td>' + usd(x.valor) + '</td><td>' + usd(x.esperado) + '</td><td class="' + (x.dif >= 0 ? 'mas' : 'menos') + '">' + textoVar(x.dif, x.difPct) + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<p class="hvacio">No se encontraron días atípicos.</p>';
    h += tarjeta('Días atípicos', 'Los 10 más recientes. Esperado: el promedio del momento ajustado por el día de la semana. Es atípico si se aparta más de 3,5 veces la variación típica (puntaje robusto). Los días de quincena y fin de mes suelen aparecer aquí por el pago de nómina.', tAt);

    /* 6. Cambio de nivel */
    var cm = M.cambio, txtC;
    if (cm && cm.hay) {
      var vc = Est.variacion(cm.nivelDespues, cm.nivelAntes);
      txtC = '<p class="hexp" style="color:' + C.tinta + ';font-size:14px;margin-top:10px">Desde el <b>' + fechaDMA(cm.fecha) + '</b> la venta diaria media pasó de <b>' + usd(cm.nivelAntes) + '</b> a <b>' + usd(cm.nivelDespues) + '</b> ' +
        '<span class="hchip ' + (vc.dif >= 0 ? 'mas' : 'menos') + '">' + textoVar(vc.dif, vc.pct) + '</span></p>' +
        '<p class="hnota">Montos de un día promedio, sin el efecto del día de la semana, justo antes y justo después del salto; el crecimiento gradual de fondo se descuenta aparte. ' +
        'Probabilidad de ver un salto así por azar: ' + (cm.p <= 0.0034 ? 'menos de 0,4 %' : num(cm.p * 100, 1) + ' %') + ' (se repite la búsqueda 299 veces con la serie barajada por bloques de días, porque elegir el día del mayor salto exagera cualquier prueba común). ' +
        'Solo se informa si esa probabilidad es menor de 1 % y el salto supera el 5 %. En la gráfica de tendencia aparece como «Nivel con el cambio».</p>';
    } else txtC = '<p class="hexp" style="margin-top:10px">No se detecta un cambio de nivel claro en la venta diaria media.</p>';
    h += tarjeta('Cambio de nivel', 'Busca el día en que la venta media dio un salto, aparte del crecimiento gradual, y comprueba que no sea casualidad.', txtC);

    /* 7. Nota de métodos */
    h += tarjeta('Sobre los métodos', '', '<div class="hnota"><p>Los pronósticos usan la venta diaria total con IVA de todo el histórico (' + num(P.N) + ' días); los días sin ventas se tratan como datos faltantes.</p>' +
      '<p>Los rangos suponen que los errores son aproximadamente normales. El rango del cierre del mes tiene en cuenta que, si el pronóstico se desvía un día, suele desviarse igual los días siguientes. En la práctica pueden quedarse cortos ante feriados o hechos imprevistos.</p>' +
      '<p>Con pocos meses de historia los pronósticos y la tendencia son orientativos. El índice estacional, la autocorrelación y los atípicos mejoran a medida que se acumulan datos.</p></div>');
    return h;
  }

  /* ============================== arranque ============================== */
  window.Hist = { estado: S, mostrar: mostrar, dibujar: dibujar };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar); else iniciar();
})();
</script>
</body>
</html>
