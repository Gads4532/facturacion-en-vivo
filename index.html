<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Facturación de hoy</title>
<style>
  :root { --tinta:#14161F; --sec:#6E7180; --fondo:#F3F4F8; --borde:#ECEDF2; --azul:#1D4ED8; --azul2:#4F7BFF;
          --verde:#0A8F4E; --verde50:#E3F6EC; --rojo:#D1173D; --rojo50:#FDE7EC; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fondo); color:var(--tinta); font-family:Inter,'Segoe UI',Roboto,Arial,sans-serif;
         -webkit-font-smoothing:antialiased; }
  main { max-width:520px; margin:0 auto; padding:20px 14px 36px; }
  .cab { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--sec); padding:0 4px; }
  .estado { display:flex; align-items:center; gap:6px; }
  .punto { width:8px; height:8px; border-radius:50%; background:var(--verde); box-shadow:0 0 0 4px var(--verde50); }
  .punto.error { background:var(--rojo); box-shadow:0 0 0 4px var(--rojo50); }
  .hero { margin-top:14px; padding:24px 22px 22px; border-radius:24px; color:#fff;
          background:linear-gradient(135deg, var(--azul) 0%, var(--azul2) 100%); box-shadow:0 12px 30px rgba(29,78,216,.25); }
  .hero .et { font-size:13px; opacity:.85; letter-spacing:.3px; }
  .hero .total { font-size:58px; font-weight:800; line-height:1; margin:8px 0 10px; letter-spacing:-1.5px;
                 font-variant-numeric:tabular-nums; }
  .hero .det { font-size:14px; opacity:.85; }
  .pill { display:inline-block; margin-top:16px; padding:7px 12px; border-radius:999px; font-size:13px; font-weight:600;
          background:rgba(255,255,255,.18); }
  .hero .barra { background:rgba(255,255,255,.25); margin-top:12px; }
  .hero .barra > i { background:#fff; }
  .mes { margin-top:12px; padding:14px 18px; border-radius:18px; background:#fff; display:flex; justify-content:space-between;
         align-items:baseline; font-size:14px; color:var(--sec); }
  .mes b { color:var(--tinta); font-size:18px; font-variant-numeric:tabular-nums; }
  .tarjeta { margin-top:12px; padding:6px 18px; border-radius:18px; background:#fff; }
  .titulo { font-size:13px; color:var(--sec); padding:12px 0 6px; }
  .fila { padding:14px 0; border-top:1px solid var(--borde); }
  .fila .a { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .fila .nom { font-size:16px; font-weight:600; }
  .fila .ven { font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; }
  .fila .b { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:4px; font-size:12.5px;
             color:var(--sec); }
  .chip { padding:3px 8px; border-radius:999px; font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .chip.mas { color:var(--verde); background:var(--verde50); }
  .chip.menos { color:var(--rojo); background:var(--rojo50); }
  .barra { height:4px; border-radius:2px; background:var(--borde); margin-top:10px; overflow:hidden; }
  .barra > i { display:block; height:100%; border-radius:2px; background:var(--azul); }
  .aviso { margin-top:14px; padding:12px 16px; border-radius:14px; font-size:14px; color:var(--rojo); background:var(--rojo50);
           display:none; }
  .pie { margin-top:18px; font-size:12px; color:var(--sec); text-align:center; }
  /* Animación al cambiar un valor: el número corre hasta el nuevo y se tiñe un instante */
  .n { display:inline-block; }
  .n.sube { animation:sube 1.8s ease-out; }
  .n.baja { animation:baja 1.8s ease-out; }
  .hero .n.sube { animation-name:subeHero; }
  .hero .n.baja { animation-name:bajaHero; }
  @keyframes sube { 0%,35% { color:var(--verde); } 100% { color:inherit; } }
  @keyframes baja { 0%,35% { color:var(--rojo); } 100% { color:inherit; } }
  @keyframes subeHero { 0%,35% { color:#B8F7D4; } 100% { color:inherit; } }
  @keyframes bajaHero { 0%,35% { color:#FFD3DC; } 100% { color:inherit; } }
  .barra > i { transition:width .9s cubic-bezier(.2,.8,.2,1); }
  #contenido.entra { animation:entra .45s ease-out; }
  @keyframes entra { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .n.sube, .n.baja, #contenido.entra { animation:none; } .barra > i { transition:none; } }
  @media (max-width:360px) { .hero .total { font-size:46px; } }
</style>
</head>
<body>
<main>
  <div class="cab"><span id="fecha">Facturación de hoy</span>
    <span class="estado"><span class="punto" id="punto"></span><span id="estado">cargando…</span></span></div>
  <div class="aviso" id="aviso"></div>
  <div id="contenido"></div>
  <div class="pie">Datos de Plade · se actualiza solo cada 2 minutos</div>
</main>
<script>
  // Dirección de la app web de Apps Script (modo datos). La clave va en el link después de #k= y nunca llega a GitHub.
  var API = 'https://script.google.com/macros/s/AKfycbyBAqww70el0Vcrl-6SbSuQYJ7-CoPuhq3YRMWZXV7xk3mMxPBKv1pbwheMi2lDGtrc1Q/exec';
  var CADA = 120000;
  var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

  function usd(x, dec) {
    var d = dec ? 2 : 0;
    return '$' + Number(x || 0).toLocaleString('es-VE', { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function ent(x) { return Number(x || 0).toLocaleString('es-VE', { maximumFractionDigits: 0 }); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fechaCorta(iso) { var d = new Date(iso + 'T12:00:00'); return DIAS[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1); }

  // Variación frente al cierre de un día: «+$8.228 · +67 %» (verde) o «−$681 · −31 %» (rojo)
  function variacion(hoy, antes) {
    if (!antes) return null;
    var v = Math.round((hoy - antes) / antes * 100), sube = hoy >= antes;
    return { sube: sube, txt: (sube ? '+' : '−') + usd(Math.abs(hoy - antes)) + ' · ' + (sube ? '+' : '−') + ent(Math.abs(v)) + '\u00a0%' };
  }
  // Número animable: guarda su valor para compararlo en la siguiente actualización.
  function n(k, x, dec) { return '<span class="n" data-k="' + esc(k) + '" data-v="' + Number(x || 0) + '"' + (dec ? ' data-d="1"' : '') + '>' + usd(x, dec) + '</span>'; }
  function nEnt(k, x) { return '<span class="n" data-k="' + esc(k) + '" data-v="' + Number(x || 0) + '" data-e="1">' + ent(x) + '</span>'; }
  function barra(hoy, antes, k) {
    return antes ? '<div class="barra"><i data-k="' + esc(k) + '" data-w="' + Math.min(100, Math.round(hoy / antes * 100)) + '"></i></div>' : '';
  }

  var antes = {}, anchos = {}, primera = true;
  var QUIETO = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function animar() {
    var cont = document.getElementById('contenido');
    if (primera) { cont.classList.add('entra'); primera = false; }
    cont.querySelectorAll('.n').forEach(function (el) {
      var k = el.dataset.k, v = Number(el.dataset.v), o = antes[k];
      antes[k] = v;
      if (o === undefined || o === v) return;
      el.classList.add(v > o ? 'sube' : 'baja');
      if (QUIETO) return;
      var fmt = el.dataset.e ? ent : function (x) { return usd(x, !!el.dataset.d); };
      var t0 = null, DUR = 900;
      el.textContent = fmt(o);
      (function paso(t) {
        if (t0 === null) t0 = t;
        var p = Math.min(1, (t - t0) / DUR), e = 1 - Math.pow(1 - p, 3);
        el.textContent = fmt(p < 1 ? o + (v - o) * e : v);
        if (p < 1) requestAnimationFrame(paso);
      })(performance.now());
    });
    cont.querySelectorAll('.barra > i').forEach(function (el) {
      var k = el.dataset.k, w = Number(el.dataset.w), o = anchos[k];
      anchos[k] = w;
      el.style.width = (o === undefined ? w : o) + '%';
      if (o !== undefined && o !== w) requestAnimationFrame(function () { requestAnimationFrame(function () { el.style.width = w + '%'; }); });
    });
  }

  function pintar(d) {
    var ref = fechaCorta(d.sem), si = d.sinIva, h = [];
    document.getElementById('fecha').textContent = 'Facturación de hoy · ' + fechaCorta(d.hoy);
    var vt = variacion(d.venta, d.semVenta);
    h.push('<div class="hero"><div class="et">Vendido hoy' + (d.conIva ? ' · con IVA' : '') + '</div>' +
           '<div class="total">' + n('venta', d.venta) + '</div>' +
           '<div class="det">' + (si ? 'Sin IVA ' + n('sinIva', si.venta) + ' · ' : '') + nEnt('tk', d.tk) + ' tickets · ticket ' + n('ticket', d.ticket, true) + '</div>' +
           (vt ? '<div class="pill">' + vt.txt + ' frente al ' + ref + '</div>' + barra(d.venta, d.semVenta, 'total') : '') +
           '</div>');
    h.push('<div class="mes"><span>Mes acumulado' + (si ? ' · sin IVA ' + n('mesSin', si.mes) : '') + '</span><b>' + n('mes', d.mes) + '</b></div>');
    h.push('<div class="tarjeta"><div class="titulo">Sucursales · frente al cierre del ' + ref + '</div>');
    d.filas.forEach(function (f) {
      var v = variacion(f.venta, f.sem);
      h.push('<div class="fila"><div class="a"><span class="nom">' + esc(f.nombre) + '</span><span class="ven">' + n('v:' + f.nombre, f.venta) + '</span></div>' +
             '<div class="b"><span>' + nEnt('t:' + f.nombre, f.tk) + ' tickets' + (si ? ' · sin IVA ' + n('s:' + f.nombre, f.sinIva) : '') + '</span>' +
             (v ? '<span class="chip ' + (v.sube ? 'mas' : 'menos') + '">' + v.txt + '</span>' : '<span>sin ventas el ' + ref + '</span>') +
             '</div>' + barra(f.venta, f.sem, 'b:' + f.nombre) + '</div>');
    });
    if (!d.filas.length) h.push('<div class="fila">Todavía no hay ventas hoy.</div>');
    h.push('</div>');
    document.getElementById('contenido').innerHTML = h.join('');
    animar();
    document.getElementById('punto').className = 'punto';
    document.getElementById('estado').textContent = 'actualizado ' + d.hora;
    document.getElementById('aviso').style.display = 'none';
  }

  function fallo(err) {
    document.getElementById('punto').className = 'punto error';
    document.getElementById('estado').textContent = 'sin conexión';
    var a = document.getElementById('aviso');
    a.textContent = 'No pude traer los datos: ' + ((err && err.message) || err) + '. Reintento en 2 minutos.';
    a.style.display = 'block';
  }

  // La clave se lee en cada consulta (si se cambia lo que va después de #k= sin recargar, se usa la nueva).
  function clave() {
    var m = location.hash.match(/k=([^&]+)/) || location.search.match(/k=([^&]+)/);
    var k = m ? m[1] : '';
    try { k = decodeURIComponent(k); } catch (e) {}
    return k.replace(/[^0-9a-zA-Z]/g, '');
  }

  function cargar() {
    if (window.DATOS_PRUEBA) { pintar(window.DATOS_PRUEBA); return; }
    var CLAVE = clave();
    if (!CLAVE) { fallo('el link no trae la clave; usa el botón del reporte diario'); return; }
    fetch(API + '?formato=json&k=' + encodeURIComponent(CLAVE), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (r) { if (r && r.ok) pintar(r.datos); else fallo(r && r.error === 'Link no válido' ? 'el link no es válido' : (r && r.error) || 'sin respuesta'); })
      .catch(function (err) { fallo(err); });
  }
  cargar();
  setInterval(cargar, CADA);
  window.addEventListener('hashchange', cargar);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) cargar(); });
</script>
</body>
</html>
