<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Facturación de hoy</title>
<style>
  :root { --tinta:#14161F; --sec:#6E7180; --fondo:#F3F4F8; --borde:#ECEDF2; --azul:#1D4ED8; --azul2:#4F7BFF;
          --verde:#0A8F4E; --verde50:#E3F6EC; --rojo:#D1173D; --rojo50:#FDE7EC; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fondo); color:var(--tinta); font-family:Inter,'Segoe UI',Roboto,Arial,sans-serif;
         -webkit-font-smoothing:antialiased; }
  main { max-width:520px; margin:0 auto; padding:20px 14px 36px; }
  .cab { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--sec); padding:0 4px; }
  .estado { display:flex; align-items:center; gap:6px; }
  .punto { width:8px; height:8px; border-radius:50%; background:var(--verde); box-shadow:0 0 0 4px var(--verde50); }
  .punto.error { background:var(--rojo); box-shadow:0 0 0 4px var(--rojo50); }
  .hero { margin-top:14px; padding:24px 22px 22px; border-radius:24px; color:#fff;
          background:linear-gradient(135deg, var(--azul) 0%, var(--azul2) 100%); box-shadow:0 12px 30px rgba(29,78,216,.25); }
  .hero .et { font-size:13px; opacity:.85; letter-spacing:.3px; }
  .hero .total { font-size:58px; font-weight:800; line-height:1; margin:8px 0 10px; letter-spacing:-1.5px;
                 font-variant-numeric:tabular-nums; }
  .hero .det { font-size:14px; opacity:.85; }
  .pill { display:inline-block; margin-top:16px; padding:7px 12px; border-radius:999px; font-size:13px; font-weight:600;
          background:rgba(255,255,255,.18); }
  /* Verde si sube, rojo si baja (tonos que contrastan bien con el azul) */
  .pill.sube { background:#16A34A; color:#fff; box-shadow:0 4px 12px rgba(10,80,40,.25); }
  .pill.baja { background:#E11D48; color:#fff; box-shadow:0 4px 12px rgba(120,10,40,.25); }
  .pill .flecha { font-size:10px; margin-right:6px; vertical-align:1px; }
  .hero .barra { background:rgba(255,255,255,.25); margin-top:12px; }
  .hero .barra > i { background:#fff; }
  .hero .cierre { margin-top:14px; font-size:14px; color:rgba(255,255,255,.85); }
  .hero .cierre b { color:#fff; font-weight:700; margin-left:4px; }
  .cierreS b { color:var(--tinta); font-weight:700; margin-left:2px; }
  .hero .cierre.junto { margin-top:4px; }
  .ref { font-size:12px; color:var(--sec); margin-top:4px; }
  .ref b { color:var(--tinta); font-weight:600; }
  .mes { margin-top:12px; padding:14px 18px; border-radius:18px; background:#fff; display:flex; justify-content:space-between;
         align-items:baseline; font-size:14px; color:var(--sec); }
  .mes b { color:var(--tinta); font-size:18px; font-variant-numeric:tabular-nums; }
  .tarjeta { margin-top:12px; padding:6px 18px; border-radius:18px; background:#fff; }
  .titulo { font-size:14px; font-weight:700; color:var(--tinta); padding:12px 0 6px; }
  .fila { padding:14px 0; border-top:1px solid var(--borde); }
  .fila .a { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .fila .nom { font-size:16px; font-weight:600; }
  .fila .ven { font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; }
  .fila .b { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:4px; font-size:12.5px;
             color:var(--sec); }
  .chip { padding:3px 8px; border-radius:999px; font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .chip.mas { color:var(--verde); background:var(--verde50); }
  .chip.menos { color:var(--rojo); background:var(--rojo50); }
  .barra { height:4px; border-radius:2px; background:var(--borde); margin-top:10px; overflow:hidden; }
  .barra > i { display:block; height:100%; border-radius:2px; background:var(--azul); }
  .aviso { margin-top:14px; padding:12px 16px; border-radius:14px; font-size:14px; color:var(--rojo); background:var(--rojo50);
           display:none; }
  .pie { margin-top:18px; font-size:12px; color:var(--sec); text-align:center; }
  /* Animación al cambiar un valor: el número corre hasta el nuevo y se tiñe un instante */
  .n { display:inline-block; }
  .n.sube { animation:sube 1.8s ease-out; }
  .n.baja { animation:baja 1.8s ease-out; }
  .hero .n.sube { animation-name:subeHero; }
  .hero .n.baja { animation-name:bajaHero; }
  @keyframes sube { 0%,35% { color:var(--verde); } 100% { color:inherit; } }
  @keyframes baja { 0%,35% { color:var(--rojo); } 100% { color:inherit; } }
  @keyframes subeHero { 0%,35% { color:#B8F7D4; } 100% { color:inherit; } }
  @keyframes bajaHero { 0%,35% { color:#FFD3DC; } 100% { color:inherit; } }
  .barra > i { transition:width .9s cubic-bezier(.2,.8,.2,1); }
  #contenido.entra { animation:entra .45s ease-out; }
  @keyframes entra { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .n.sube, .n.baja, #contenido.entra { animation:none; } .barra > i { transition:none; } }
  @media (max-width:360px) { .hero .total { font-size:46px; } }
</style>
<!-- ===== Pestañas Histórico, Sucursales y Pronóstico: estilos (historico.css) ===== -->
<style>
/* ===== Pestañas Histórico, Sucursales y Pronóstico (historico.css) ===== */
  .pestanas { display:flex; gap:2px; margin-top:12px; padding:3px; border-radius:13px; background:#E4E6EE; }
  .pestanas button { flex:1 1 0; min-width:0; border:0; background:transparent; font:inherit; font-size:13.5px; font-weight:600;
                     color:var(--sec); padding:8px 2px; border-radius:10px; cursor:pointer; white-space:nowrap;
                     -webkit-tap-highlight-color:transparent; }
  .pestanas button.activa { background:#fff; color:var(--tinta); box-shadow:0 1px 3px rgba(20,22,31,.12); }
  .pestanas button:focus-visible { outline:2px solid var(--azul2); outline-offset:1px; }
  #vistaHist[hidden] { display:none; }
  #vistaHist { font-size:14px; }

  /* Controles: período e IVA */
  .hctl { margin-top:12px; }
  .hseg { display:flex; gap:2px; padding:3px; border-radius:12px; background:#fff; }
  .hseg button { flex:1 1 0; min-width:0; border:0; background:transparent; font:inherit; font-size:13px; font-weight:600; color:var(--sec);
                 padding:7px 2px; border-radius:9px; cursor:pointer; white-space:nowrap; -webkit-tap-highlight-color:transparent; }
  .hseg button.activa { background:var(--azul); color:#fff; }
  .hctl2 { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:8px; padding:0 4px;
           font-size:12.5px; color:var(--sec); }
  .hctl2 .hseg { padding:2px; flex:0 0 auto; }
  .hctl2 .hseg button { padding:5px 10px; font-size:12px; flex:0 0 auto; }
  .hctl2 .hseg button.activa { background:var(--tinta); }

  /* Tarjetas y textos */
  .ht { margin-top:12px; padding:14px 18px 16px; border-radius:18px; background:#fff; min-width:0; }
  .ht h2 { margin:0; font-size:14px; font-weight:700; color:var(--tinta); }
  .hexp { margin:3px 0 0; font-size:12.5px; line-height:1.4; color:var(--sec); }
  .hsub { margin:14px 0 6px; font-size:13px; font-weight:700; color:var(--tinta); }
  .hnota { margin-top:10px; font-size:12px; line-height:1.45; color:var(--sec); }
  .hnota p { margin:0 0 6px; }
  .hgraf { position:relative; width:100%; margin-top:12px; }
  .hgraf canvas { position:absolute; inset:0; }
  .hvacio { padding:18px 0 6px; font-size:13px; color:var(--sec); }

  /* Resumen principal del período */
  .hres .hgrande { font-size:34px; font-weight:800; letter-spacing:-.8px; margin:6px 0 2px; font-variant-numeric:tabular-nums; }
  .hcomp { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--borde);
           font-size:12.5px; color:var(--sec); }
  .hcomp:first-of-type { margin-top:8px; }
  .hcomp > span:first-child { min-width:0; }
  .hcomp .hchip, .hcomp b { flex:0 0 auto; max-width:none; }

  /* Cuadrícula de indicadores */
  .hgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .hk { padding:12px 12px 11px; border-radius:14px; background:#F7F8FB; min-width:0; }
  .hk .e { font-size:12px; color:var(--sec); line-height:1.3; }
  .hk .v { font-size:18px; font-weight:700; margin:3px 0 6px; font-variant-numeric:tabular-nums; white-space:nowrap;
           overflow:hidden; text-overflow:ellipsis; }
  .hk .s { font-size:11.5px; color:var(--sec); margin:-3px 0 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Variaciones (verde sube, rojo baja) */
  .hchip { display:inline-block; max-width:100%; padding:2px 7px; border-radius:999px; font-size:11.5px; font-weight:600;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; vertical-align:middle; font-variant-numeric:tabular-nums;
           color:var(--sec); background:#EEF0F4; }
  .hchip.mas { color:var(--verde); background:var(--verde50); }
  .hchip.menos { color:var(--rojo); background:var(--rojo50); }
  .hchip.nueva { color:var(--azul); background:#E8EEFF; }

  /* Estado de carga, avance y error */
  .hestado { margin-top:12px; padding:22px 18px; border-radius:18px; background:#fff; font-size:14px; color:var(--sec); text-align:center; }
  .hestado.err { color:var(--rojo); background:var(--rojo50); text-align:left; }
  .hestado button, .hboton { margin-top:12px; border:0; border-radius:10px; padding:8px 14px; font:inherit; font-size:13px; font-weight:600;
                             background:var(--azul); color:#fff; cursor:pointer; }
  .hgiro { display:inline-block; width:16px; height:16px; margin-right:8px; vertical-align:-3px; border-radius:50%;
           border:2px solid #D5D9E6; border-top-color:var(--azul); animation:hgiro .8s linear infinite; }
  @keyframes hgiro { to { transform:rotate(360deg); } }
  .havance { margin-top:12px; padding:12px 16px; border-radius:14px; background:#fff; font-size:13px; color:var(--sec); }
  .havance .barra { margin-top:8px; }
  .haviso { margin-top:12px; padding:10px 14px; border-radius:14px; font-size:13px; color:var(--rojo); background:var(--rojo50); }

  /* Tablas: desplazamiento horizontal dentro de la tarjeta si no caben */
  .hscroll { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:10px -18px 0; padding:0 18px; }
  /* Sombra en el borde mientras quede contenido por ver al deslizar (las capas «local» la tapan al llegar al extremo). */
  .hscroll { background:
      linear-gradient(90deg, #fff 30%, rgba(255,255,255,0)) left center / 28px 100% no-repeat local,
      linear-gradient(270deg, #fff 30%, rgba(255,255,255,0)) right center / 28px 100% no-repeat local,
      radial-gradient(farthest-side at 0 50%, rgba(20,22,31,.22), rgba(20,22,31,0)) left center / 12px 100% no-repeat scroll,
      radial-gradient(farthest-side at 100% 50%, rgba(20,22,31,.22), rgba(20,22,31,0)) right center / 12px 100% no-repeat scroll;
    background-color:#fff; }
  .htab { width:100%; border-collapse:collapse; font-size:12.5px; font-variant-numeric:tabular-nums; }
  .htab th { text-align:right; font-weight:600; color:var(--sec); font-size:11.5px; padding:6px 6px 6px; border-bottom:1px solid var(--borde);
             white-space:nowrap; }
  .htab td { text-align:right; padding:8px 6px; border-bottom:1px solid var(--borde); white-space:nowrap; }
  .htab tr:last-child td { border-bottom:0; }
  .htab th:first-child, .htab td:first-child { text-align:left; padding-left:0; }
  .htab th:last-child, .htab td:last-child { padding-right:0; }
  .htab td.izq, .htab th.izq { text-align:left; }
  .htab .chico { font-size:11px; color:var(--sec); }
  .htab .chico.mas { color:var(--verde); }
  .htab .chico.menos { color:var(--rojo); }
  .htab .mas { color:var(--verde); font-weight:600; }
  .htab .menos { color:var(--rojo); font-weight:600; }
  .htab.suc th { cursor:pointer; user-select:none; }
  .htab.suc th.ord { color:var(--tinta); }
  .htab.suc tbody tr { cursor:pointer; }
  .htab.suc tbody tr.sel td { background:#F1F4FF; }
  .htab.suc td:first-child, .htab.suc th:first-child { position:sticky; left:0; background:#fff; z-index:1; padding-right:8px; }
  /* Nombre completo en hasta dos líneas, sin cortarlo con «…» */
  .htab.suc td:first-child { white-space:normal; min-width:92px; max-width:122px; line-height:1.25; }
  .htab.suc tbody tr.sel td:first-child { background:#F1F4FF; }
  .htab.suc td:first-child b { font-weight:600; }
  .htab td.spark { padding-top:4px; padding-bottom:4px; }

  /* Reparto convenio / farmacia */
  .hrep { margin-top:12px; padding:12px; border-radius:14px; background:#F7F8FB; }
  .hrep .t { font-size:12px; color:var(--sec); }
  .hrep .l { display:flex; justify-content:space-between; gap:10px; margin-top:6px; font-size:13px; }
  .hrep .l > span { white-space:nowrap; }
  .hrep .l b { font-variant-numeric:tabular-nums; text-align:right; }
  .hrep .l b .s { display:block; font-size:11.5px; font-weight:500; color:var(--sec); }
  .hsplit { display:flex; height:8px; border-radius:4px; overflow:hidden; margin-top:8px; background:var(--borde); }
  .hsplit i { display:block; height:100%; }
  .hpunto { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px; vertical-align:0; }

  /* Filas con barras (descomposición, mismas tiendas) */
  .hbar { padding:9px 0; border-top:1px solid var(--borde); }
  .hbar:first-child { border-top:0; }
  .hbar .a { display:flex; justify-content:space-between; gap:10px; font-size:13px; }
  .hbar .a span:first-child { color:var(--tinta); min-width:0; }
  .hbar .a b { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .hbar .p { font-size:11.5px; color:var(--sec); margin-top:2px; }
  .hbar .riel { position:relative; height:6px; margin-top:6px; border-radius:3px; background:#F1F2F6; }
  .hbar .riel i { position:absolute; top:0; height:100%; border-radius:3px; }
  .hbar .riel .cero { position:absolute; top:-3px; width:1px; height:12px; background:#C9CCD6; }

  /* Percentiles y explicaciones en lista */
  .hlista { margin-top:10px; }
  .hlista .it { display:flex; gap:12px; padding:8px 0; border-top:1px solid var(--borde); align-items:baseline; }
  .hlista .it:first-child { border-top:0; }
  .hlista .it .k { flex:0 0 86px; font-size:12.5px; font-weight:600; }
  .hlista .it .k b { display:block; font-size:14px; font-variant-numeric:tabular-nums; }
  .hlista .it .x { font-size:12.5px; color:var(--sec); line-height:1.4; }

  /* Índices por día de la semana */
  .hdias { display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; margin-top:10px; text-align:center; }
  .hdias div { padding:6px 0; border-radius:10px; background:#F7F8FB; font-size:11px; color:var(--sec); }
  .hdias b { display:block; font-size:13px; white-space:nowrap; color:var(--tinta); font-variant-numeric:tabular-nums; }

  /* Mapas de calor (SVG) */
  .hcal { overflow-x:auto; -webkit-overflow-scrolling:touch; margin-top:12px; }
  .hcal svg { display:block; }
  .hcal rect[data-i], .hmat rect[data-i] { cursor:pointer; }
  .hleyenda { display:flex; align-items:center; gap:6px; margin-top:8px; font-size:11.5px; color:var(--sec); flex-wrap:wrap; }
  .hleyenda i { display:inline-block; width:14px; height:10px; border-radius:2px; }
  .hleyenda .grad { width:120px; height:8px; border-radius:4px; }
  .hinfo { margin-top:8px; min-height:18px; font-size:12.5px; color:var(--tinta); }
  .hmat { margin-top:12px; overflow-x:auto; }
  .hmat svg { display:block; }

  /* Selector de sucursal */
  .hsel { width:100%; margin-top:10px; padding:9px 12px; border:1px solid var(--borde); border-radius:10px; background:#fff;
          font:inherit; font-size:14px; color:var(--tinta); }

  .hgrande2 { font-size:30px; font-weight:800; letter-spacing:-.6px; margin:6px 0 0; font-variant-numeric:tabular-nums; }
  .hrango { font-size:12.5px; color:var(--sec); margin-top:4px; }
  @media (max-width:360px) { .hk .v { font-size:16px; } .hres .hgrande { font-size:30px; } .pestanas button { font-size:12.5px; } }
</style>
</head>
<body>
<main>
  <div class="cab"><span id="fecha">Facturación de hoy</span>
    <span class="estado"><span class="punto" id="punto"></span><span id="estado">cargando…</span></span></div>
  <!-- Pestañas: «Hoy» es la vista de siempre; las demás las dibuja historico.js -->
  <nav class="pestanas" id="pestanas" role="tablist" aria-label="Vistas"><button type="button" role="tab" data-tab="hoy" class="activa" aria-selected="true">Hoy</button><button type="button" role="tab" data-tab="historico" aria-selected="false">Histórico</button><button type="button" role="tab" data-tab="sucursales" aria-selected="false">Sucursales</button><button type="button" role="tab" data-tab="pronostico" aria-selected="false">Pronóstico</button></nav>
  <div class="aviso" id="aviso"></div>
  <div id="contenido"></div>
  <div id="vistaHist" hidden></div>
  <div class="pie">Datos de Plade en tiempo real</div>
</main>
<script>
  // Dirección de la app web de Apps Script (modo datos). La clave va en el link después de #k= y nunca llega a GitHub.
  var API = 'https://script.google.com/macros/s/AKfycbyBAqww70el0Vcrl-6SbSuQYJ7-CoPuhq3YRMWZXV7xk3mMxPBKv1pbwheMi2lDGtrc1Q/exec';
  var CADA = 60000;
  var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

  function usd(x, dec) {
    var d = dec ? 2 : 0;
    return '$' + Number(x || 0).toLocaleString('es-VE', { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function ent(x) { return Number(x || 0).toLocaleString('es-VE', { maximumFractionDigits: 0 }); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fechaCorta(iso) { var d = new Date(iso + 'T12:00:00'); return DIAS[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1); }

  // Variación frente al cierre de un día: «+$8.228 · +67 %» (verde) o «−$681 · −31 %» (rojo)
  function variacion(hoy, antes) {
    if (!antes) return null;
    var v = Math.round((hoy - antes) / antes * 100), sube = hoy >= antes;
    return { sube: sube, txt: (sube ? '+' : '−') + usd(Math.abs(hoy - antes)) + ' · ' + (sube ? '+' : '−') + ent(Math.abs(v)) + '\u00a0%' };
  }
  // Número animable: guarda su valor para compararlo en la siguiente actualización.
  function n(k, x, dec) { return '<span class="n" data-k="' + esc(k) + '" data-v="' + Number(x || 0) + '"' + (dec ? ' data-d="1"' : '') + '>' + usd(x, dec) + '</span>'; }
  function nEnt(k, x) { return '<span class="n" data-k="' + esc(k) + '" data-v="' + Number(x || 0) + '" data-e="1">' + ent(x) + '</span>'; }
  function barra(hoy, antes, k) {
    return antes ? '<div class="barra"><i data-k="' + esc(k) + '" data-w="' + Math.min(100, Math.round(hoy / antes * 100)) + '"></i></div>' : '';
  }

  var antes = {}, anchos = {}, primera = true;
  var QUIETO = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function animar() {
    var cont = document.getElementById('contenido');
    if (primera) { cont.classList.add('entra'); primera = false; }
    cont.querySelectorAll('.n').forEach(function (el) {
      var k = el.dataset.k, v = Number(el.dataset.v), o = antes[k];
      antes[k] = v;
      if (o === undefined || o === v) return;
      el.classList.add(v > o ? 'sube' : 'baja');
      if (QUIETO) return;
      var fmt = el.dataset.e ? ent : function (x) { return usd(x, !!el.dataset.d); };
      var t0 = null, DUR = 900;
      el.textContent = fmt(o);
      (function paso(t) {
        if (t0 === null) t0 = t;
        var p = Math.min(1, (t - t0) / DUR), e = 1 - Math.pow(1 - p, 3);
        el.textContent = fmt(p < 1 ? o + (v - o) * e : v);
        if (p < 1) requestAnimationFrame(paso);
      })(performance.now());
    });
    cont.querySelectorAll('.barra > i').forEach(function (el) {
      var k = el.dataset.k, w = Number(el.dataset.w), o = anchos[k];
      anchos[k] = w;
      el.style.width = (o === undefined ? w : o) + '%';
      if (o !== undefined && o !== w) requestAnimationFrame(function () { requestAnimationFrame(function () { el.style.width = w + '%'; }); });
    });
  }

  function pintar(d) {
    var ref = fechaCorta(d.sem), si = d.sinIva, h = [];

    for (i = 0; i < n; i++) {
      var a = i - atras, b = a + k - 1;
      if (a < 0 || b >= n) { out[i] = null; continue; }
      var c = buenos[b + 1] - buenos[a];
      out[i] = c >= minimo ? (pref[b + 1] - pref[a]) / c : null;
    }
    return out;
  }

  /**
   * Histograma con la regla de Freedman–Diaconis: ancho = 2·IQR/n^(1/3); número de
   * bins = ⌈rango/ancho⌉ limitado a [5, 30]; luego ancho = rango/bins. El último bin
   * incluye el máximo.
   * @param {number[]} arr
   * @returns {{ancho:number, bins:Array<{desde:number, hasta:number, n:number}>}}
   */
  function histograma(arr) {
    var s = ordenar(arr), n = s.length;
    if (!n) return { ancho: 0, bins: [] };
    var mn = s[0], mx = s[n - 1], rango = mx - mn;
    if (rango === 0) return { ancho: 0, bins: [{ desde: mn, hasta: mx, n: n }] };
    var iqr = cuantilOrdenado(s, 0.75) - cuantilOrdenado(s, 0.25);
    var w = 2 * iqr / Math.pow(n, 1 / 3);
    var k = w > 0 ? Math.ceil(rango / w) : 30;
    k = Math.max(5, Math.min(30, k));
    var ancho = rango / k, bins = [], i;
    for (i = 0; i < k; i++) bins.push({ desde: mn + i * ancho, hasta: i === k - 1 ? mx : mn + (i + 1) * ancho, n: 0 });
    for (i = 0; i < n; i++) {
      var j = Math.floor((s[i] - mn) / ancho);
      if (j >= k) j = k - 1;
      if (j < 0) j = 0;
      bins[j].n++;
    }
    return { ancho: ancho, bins: bins };
  }

  /**
   * Variación entre dos valores.
   * @param {number} actual  @param {number} anterior
   * @returns {{dif:number, pct:number|null}} dif = actual − anterior; pct en PORCENTAJE
   *   (12,5 significa +12,5 %); null si anterior es 0 o falta un dato.
   */
  function variacion(actual, anterior) {
    if (!esNum(actual) || !esNum(anterior)) return { dif: null, pct: null };
    var dif = actual - anterior;
    return { dif: dif, pct: anterior === 0 ? null : dif / Math.abs(anterior) * 100 };
  }

  /**
   * Perfil por día de la semana.
   * @param {string[]} fechasISO  @param {number[]} y
   * @returns {Array<{dia:number, n:number, media:number|null, mediana:number|null,
   *   p25:number|null, p75:number|null, indice:number|null}>} 7 objetos, dia 0 = domingo;
   *   indice = media del día / promedio de las medias de los días con datos × 100.
   */
  function perfilSemanal(fechasISO, y) {
    var grupos = [[], [], [], [], [], [], []], i;
    for (i = 0; i < y.length; i++) if (esNum(y[i])) grupos[diaSemana(fechasISO[i])].push(y[i]);
    var out = [], medias = [];
    for (i = 0; i < 7; i++) {
      var s = grupos[i].slice().sort(function (a, b) { return a - b; });
      var o = { dia: i, n: s.length, media: s.length ? media(s) : null,
        mediana: cuantilOrdenado(s, 0.5), p25: cuantilOrdenado(s, 0.25),
        p75: cuantilOrdenado(s, 0.75), indice: null };
      if (s.length) medias.push(o.media);
      out.push(o);
    }
    var mg = media(medias);
    for (i = 0; i < 7; i++) if (out[i].n && mg) out[i].indice = out[i].media / mg * 100;
    return out;
  }

  /**
   * Análisis de Pareto.
   * @param {number[]} valores (no negativos)
   * @returns {{orden:number[], acumulado:number[], n80:number}} orden = índices de mayor a
   *   menor; acumulado = fracción acumulada (0–1) en ese orden; n80 = cuántos hacen el 80 %.
   */
  function pareto(valores) {
    var idx = [], i, tot = 0;
    for (i = 0; i < valores.length; i++) { idx.push(i); tot += esNum(valores[i]) ? valores[i] : 0; }
    idx.sort(function (a, b) { return (esNum(valores[b]) ? valores[b] : 0) - (esNum(valores[a]) ? valores[a] : 0) || a - b; });
    var acum = [], c = 0, n80 = 0;
    for (i = 0; i < idx.length; i++) {
      c += esNum(valores[idx[i]]) ? valores[idx[i]] : 0;
      acum.push(tot > 0 ? c / tot : 0);
      if (!n80 && tot > 0 && acum[i] >= 0.8 - 1e-12) n80 = i + 1;
    }
    return { orden: idx, acumulado: acum, n80: n80 };
  }

  /**
   * Índice de Herfindahl–Hirschman: suma de las participaciones al cuadrado (en %).
   * @param {number[]} valores  @returns {number|null} 0–10000 (10000 = una sola sucursal)
   */
  function hhi(valores) {
    var tot = suma(valores), h = 0;
    if (!(tot > 0)) return null;
    for (var i = 0; i < valores.length; i++) if (esNum(valores[i])) { var s = valores[i] / tot * 100; h += s * s; }
    return h;
  }

  /**
   * Descompone la variación de la venta V = T·A (tráfico × ticket promedio) en dólares,
   * con la identidad ln(V1/V0) = ln(T1/T0) + ln(A1/A0) repartida proporcionalmente
   * (media logarítmica, LMDI). Si algún valor es 0, cae a un reparto simple:
   * efecto tráfico = (T1 − T0)·A0 y el resto al ticket.
   * @param {number} V0 venta anterior  @param {number} T0 tickets anteriores
   * @param {number} V1 venta actual    @param {number} T1 tickets actuales
   * @returns {{dV:number, efectoTrafico:number, efectoTicket:number}} los efectos suman dV
   */
  function descomponerVariacion(V0, T0, V1, T1) {
    var dV = V1 - V0;
    if (V0 > 0 && T0 > 0 && V1 > 0 && T1 > 0) {
      var L = V1 === V0 ? V0 : dV / Math.log(V1 / V0);
      var eT = L * Math.log(T1 / T0);
      var eA = L * Math.log((V1 / T1) / (V0 / T0));
      return { dV: dV, efectoTrafico: eT, efectoTicket: eA };
    }
    var A0 = T0 > 0 ? V0 / T0 : (T1 > 0 ? V1 / T1 : 0);
    var efT = (T1 - T0) * A0;
    return { dV: dV, efectoTrafico: efT, efectoTicket: dV - efT };
  }

  /* ===================== relación y regresión ===================== */

  function pares(x, y) {
    var a = [], b = [];
    for (var i = 0; i < Math.min(x.length, y.length); i++) if (esNum(x[i]) && esNum(y[i])) { a.push(x[i]); b.push(y[i]); }
    return [a, b];
  }

  /**
   * Correlación de Pearson con valor p bilateral (t con n−2 g.l.). Usa solo los pares
   * donde ambos valores son numéricos.
   * @param {number[]} x  @param {number[]} y
   * @returns {{r:number|null, r2:number|null, n:number, p:number|null}}
   */
  function pearson(x, y) {
    var pr = pares(x, y), a = pr[0], b = pr[1], n = a.length, i;
    if (n < 3) return { r: null, r2: null, n: n, p: null };
    var ma = media(a), mb = media(b), sab = 0, saa = 0, sbb = 0;
    for (i = 0; i < n; i++) {
      var da = a[i] - ma, db = b[i] - mb;
      sab += da * db; saa += da * da; sbb += db * db;
    }
    if (!(saa > 0) || !(sbb > 0)) return { r: null, r2: null, n: n, p: null };
    var r = sab / Math.sqrt(saa * sbb);
    if (r > 1) r = 1; if (r < -1) r = -1;
    var p = Math.abs(r) === 1 ? 0 : pBilateral(r * Math.sqrt((n - 2) / (1 - r * r)), n - 2);
    return { r: r, r2: r * r, n: n, p: p };
  }

  /**
   * Matriz de correlaciones de Pearson entre series alineadas por día (null = sin dato).
   * @param {Array<Array<number|null>>} series  k series del mismo largo
   * @returns {Array<Array<number|null>>} k×k; null si hay menos de 10 días comunes
   */
  function correlacionMatriz(series) {
    var k = series.length, M = [], i, j;
    for (i = 0; i < k; i++) M.push(new Array(k));
    for (i = 0; i < k; i++) {
      for (j = i; j < k; j++) {
        var res = pearson(series[i], series[j]);
        var v = res.n >= 10 ? res.r : null;
        M[i][j] = v; M[j][i] = v;
      }
    }
    return M;
  }

  /**
   * Regresión lineal simple por MCO: y = intercepto + pendiente·x.
   * @param {number[]} x  @param {number[]} y
   * @returns {{pendiente:number, intercepto:number, r2:number, ePendiente:number,
   *   ic95:number[], t:number, p:number, n:number, residuos:number[]}|null}
   *   ePendiente = error estándar; ic95 = [lo, hi] con t de n−2 g.l.; residuos = y − ŷ
   *   (solo de los pares válidos).
   */
  function regresionLineal(x, y) {
    var pr = pares(x, y), a = pr[0], b = pr[1], n = a.length, i;
    if (n < 3) return null;
    var ma = media(a), mb = media(b), sxx = 0, sxy = 0, syy = 0;
    for (i = 0; i < n; i++) {
      var dx = a[i] - ma, dy = b[i] - mb;
      sxx += dx * dx; sxy += dx * dy; syy += dy * dy;
    }
    if (!(sxx > 0)) return null;
    var pend = sxy / sxx, inter = mb - pend * ma, sse = 0, res = [];
    for (i = 0; i < n; i++) { var e = b[i] - inter - pend * a[i]; res.push(e); sse += e * e; }
    var se = Math.sqrt(sse / (n - 2) / sxx);
    var t = se > 0 ? pend / se : (pend === 0 ? 0 : Infinity * Math.sign(pend));
    var tc = tInv(0.975, n - 2);
    return { pendiente: pend, intercepto: inter, r2: syy > 0 ? 1 - sse / syy : null,
      ePendiente: se, ic95: [pend - tc * se, pend + tc * se], t: t,
      p: pBilateral(t, n - 2), n: n, residuos: res };
  }

  /**
   * Regresión múltiple por MCO resuelta con descomposición QR (Householder), estable
   * numéricamente. Se agrega una columna de unos (intercepto) como primer coeficiente,
   * salvo opciones.intercepto === false. Filas con algún valor no numérico se omiten.
   * @param {number[][]} X  filas de regresores (n × p, sin la columna de unos)
   * @param {number[]} y    respuesta (largo n)
   * @param {{intercepto?:boolean}} [opciones]
   * @returns {{coef:number[], ee:number[], t:number[], p:number[], r2:number, r2aj:number,
   *   residuos:number[], sigma:number, n:number, gl:number}|null} null si la matriz es
   *   singular (columnas colineales) o faltan datos.
   */
  function mco(X, y, opciones) {
    var inter = !(opciones && opciones.intercepto === false);
    var filas = [], yy = [], i, j, k;
    for (i = 0; i < y.length; i++) {
      if (!esNum(y[i]) || !X[i]) continue;
      var f = inter ? [1] : [], ok = true;
      for (j = 0; j < X[i].length; j++) { if (!esNum(X[i][j])) { ok = false; break; } f.push(X[i][j]); }
      if (!ok) continue;
      filas.push(f); yy.push(y[i]);
    }
    var n = filas.length;
    if (!n) return null;
    var p = filas[0].length;
    if (n <= p) return null;
    // A por columnas
    var A = [];
    for (j = 0; j < p; j++) { var col = new Float64Array(n); for (i = 0; i < n; i++) col[i] = filas[i][j]; A.push(col); }
    var qty = Float64Array.from ? Float64Array.from(yy) : new Float64Array(yy);
    var normMax = 0;
    for (j = 0; j < p; j++) { var s2 = 0; for (i = 0; i < n; i++) s2 += A[j][i] * A[j][i]; normMax = Math.max(normMax, Math.sqrt(s2)); }
    var R = [];
    for (k = 0; k < p; k++) {
      var xk = A[k], nrm = 0;
      for (i = k; i < n; i++) nrm += xk[i] * xk[i];
      nrm = Math.sqrt(nrm);
      if (nrm <= 1e-10 * normMax) return null;
      var alfa = xk[k] > 0 ? -nrm : nrm;
      var v = new Float64Array(n);
      for (i = k; i < n; i++) v[i] = xk[i];
      v[k] -= alfa;
      var vv = 0;
      for (i = k; i < n; i++) vv += v[i] * v[i];
      if (vv > 0) {
        for (j = k; j < p; j++) {
          var dot = 0;
          for (i = k; i < n; i++) dot += v[i] * A[j][i];
          var fac = 2 * dot / vv;
          for (i = k; i < n; i++) A[j][i] -= fac * v[i];
        }
        var dy = 0;
        for (i = k; i < n; i++) dy += v[i] * qty[i];
        var fy = 2 * dy / vv;
        for (i = k; i < n; i++) qty[i] -= fy * v[i];
      }
      if (Math.abs(A[k][k]) <= 1e-10 * normMax) return null;
    }
    for (i = 0; i < p; i++) { R.push([]); for (j = 0; j < p; j++) R[i].push(j >= i ? A[j][i] : 0); }
    // sustitución hacia atrás
    var coef = new Array(p);
    for (i = p - 1; i >= 0; i--) {
      var s = qty[i];
      for (j = i + 1; j < p; j++) s -= R[i][j] * coef[j];
      coef[i] = s / R[i][i];
    }
    // inversa de R (triangular superior)
    var Ri = [];
    for (i = 0; i < p; i++) { Ri.push(new Array(p)); for (j = 0; j < p; j++) Ri[i][j] = 0; }
    for (j = 0; j < p; j++) {
      Ri[j][j] = 1 / R[j][j];
      for (i = j - 1; i >= 0; i--) {
        var acc = 0;
        for (k = i + 1; k <= j; k++) acc += R[i][k] * Ri[k][j];
        Ri[i][j] = -acc / R[i][i];
      }
    }
    var res = [], sse = 0, my = media(yy), sst = 0;
    for (i = 0; i < n; i++) {
      var yh = 0;
      for (j = 0; j < p; j++) yh += filas[i][j] * coef[j];
      var e = yy[i] - yh;
      res.push(e); sse += e * e;
      sst += (yy[i] - my) * (yy[i] - my);
    }
    var gl = n - p, sig2 = sse / gl, ee = [], tt = [], pp = [];
    for (j = 0; j < p; j++) {
      var q = 0;
      for (k = j; k < p; k++) q += Ri[j][k] * Ri[j][k];
      var se = Math.sqrt(sig2 * q);
      ee.push(se);
      var tv = se > 0 ? coef[j] / se : null;
      tt.push(tv);
      pp.push(tv === null ? null : pBilateral(tv, gl));
    }
    var r2 = sst > 0 ? 1 - sse / sst : null;
    var r2aj = r2 === null ? null : 1 - (1 - r2) * (n - (inter ? 1 : 0)) / gl;
    return { coef: coef, ee: ee, t: tt, p: pp, r2: r2, r2aj: r2aj, residuos: res,
      sigma: Math.sqrt(sig2), n: n, gl: gl };
  }

  /**
   * Tendencia lineal separada del efecto semanal: MCO de y contra el tiempo (días desde
   * la primera fecha) más 6 variables indicadoras de día de semana (referencia: el primer
   * día presente, normalmente el domingo).
   * @param {string[]} fechasISO  @param {number[]} y
   * @returns {{pendienteDia:number, ee:number, ic95:number[], p:number, r2:number,
   *   r2aj:number, n:number, efectoDia:Array<number|null>}|null} efectoDia: 7 valores en $
   *   (0 = domingo) relativos al promedio de los días presentes (suman 0).
   */
  function tendenciaConSemana(fechasISO, y) {
    var presentes = [0, 0, 0, 0, 0, 0, 0], i, d;
    var f0 = null;
    for (i = 0; i < y.length; i++) if (esNum(y[i])) { presentes[diaSemana(fechasISO[i])]++; if (f0 === null) f0 = fechasISO[i]; }
    var dias = [];
    for (d = 0; d < 7; d++) if (presentes[d]) dias.push(d);
    if (f0 === null || dias.length < 1) return null;
    var ref = dias[0], otros = dias.slice(1);
    var X = [], yy = [];
    for (i = 0; i < y.length; i++) {
      if (!esNum(y[i])) continue;
      var ds = diaSemana(fechasISO[i]), fila = [difDias(f0, fechasISO[i])];
      for (var j = 0; j < otros.length; j++) fila.push(ds === otros[j] ? 1 : 0);
      X.push(fila); yy.push(y[i]);
    }
    var m = mco(X, yy);
    if (!m) return null;
    var tc = tInv(0.975, m.gl);
    var ef = [null, null, null, null, null, null, null];
    ef[ref] = 0;
    for (j = 0; j < otros.length; j++) ef[otros[j]] = m.coef[2 + j];
    var mef = media(ef);
    for (d = 0; d < 7; d++) if (ef[d] !== null) ef[d] -= mef;
    return { pendienteDia: m.coef[1], ee: m.ee[1], ic95: [m.coef[1] - tc * m.ee[1], m.coef[1] + tc * m.ee[1]],
      p: m.p[1], r2: m.r2, r2aj: m.r2aj, n: m.n, efectoDia: ef };
  }

  /* ===================== series de tiempo ===================== */

  /**
   * Función de autocorrelación (como statsmodels acf con adjusted=False).
   * @param {number[]} y serie sin huecos  @param {number} maxLag
   * @returns {{valores:number[], banda:number, n:number}} valores = [r1 … r_maxLag];
   *   banda = 1,96/√n (fuera de ±banda la autocorrelación es significativa al 5 %).
   */
  function acf(y, maxLag) {
    var x = limpios(y), n = x.length, m = media(x), den = 0, i, k, vals = [];
    for (i = 0; i < n; i++) den += (x[i] - m) * (x[i] - m);
    for (k = 1; k <= maxLag; k++) {
      if (k >= n || !(den > 0)) { vals.push(null); continue; }
      var num = 0;
      for (i = 0; i + k < n; i++) num += (x[i] - m) * (x[i + k] - m);
      vals.push(num / den);
    }
    return { valores: vals, banda: n ? 1.96 / Math.sqrt(n) : null, n: n };
  }

  /* --- Holt-Winters ---------------------------------------------------------
   * Recurrencias (forma clásica, iguales a statsmodels ExponentialSmoothing):
   *  aditivo:        ŷ_t = l_{t−1} + b_{t−1} + s_{t−m}
   *                  l_t = α(y_t − s_{t−m}) + (1−α)(l_{t−1} + b_{t−1})
   *                  s_t = γ(y_t − l_{t−1} − b_{t−1}) + (1−γ)s_{t−m}
   *  multiplicativo: ŷ_t = (l_{t−1} + b_{t−1})·s_{t−m}
   *                  l_t = α·y_t/s_{t−m} + (1−α)(l_{t−1} + b_{t−1})
   *                  s_t = γ·y_t/(l_{t−1} + b_{t−1}) + (1−γ)s_{t−m}
   *  ambos:          b_t = β(l_t − l_{t−1}) + (1−β)b_{t−1}
   * Inicialización estándar con las 2 primeras temporadas (A1, A2 = sus medias):
   *  l_0 = A1;  b_0 = (A2 − A1)/m;
   *  s_j = ((y_j − A1) + (y_{j+m} − A2))/2 (aditivo, centrado a suma 0) o
   *  s_j = (y_j/A1 + y_{j+m}/A2)/2 (multiplicativo, normalizado a media 1).
   * ------------------------------------------------------------------------ */

  function hwInicial(y, m, mult) {
    if (y.length < 2 * m) return null;
    var A1 = 0, A2 = 0, j, completo = true;
    for (j = 0; j < 2 * m; j++) if (!esNum(y[j])) { completo = false; break; }
    if (!completo) return hwInicialFaltantes(y, m, mult);
    for (j = 0; j < m; j++) { A1 += y[j]; A2 += y[j + m]; }
    A1 /= m; A2 /= m;
    if (mult && !(A1 > 0 && A2 > 0)) return null;
    var s = new Float64Array(m), tot = 0;
    for (j = 0; j < m; j++) {
      s[j] = mult ? (y[j] / A1 + y[j + m] / A2) / 2 : ((y[j] - A1) + (y[j + m] - A2)) / 2;
      tot += s[j];
    }
    for (j = 0; j < m; j++) s[j] = mult ? s[j] / (tot / m) : s[j] - tot / m;
    if (mult) for (j = 0; j < m; j++) if (!(s[j] > 0)) return null;
    return { nivel: A1, tendencia: (A2 - A1) / m, estacional: s };
  }

  /* Inicialización cuando faltan datos (días cerrados) en las 2 primeras temporadas:
     usa hasta 4 temporadas y solo los valores disponibles. Media de cada temporada
     ajustada por el índice estacional (dos pasadas), nivel y tendencia por MCO sobre
     esas medias; un día de la semana sin ningún dato queda con índice neutro. */
  function hwInicialFaltantes(y, m, mult) {
    var K = Math.min(4, Math.floor(y.length / m)), A = [], s = new Float64Array(m), k, j, pasada;
    for (j = 0; j < m; j++) s[j] = mult ? 1 : 0;
    for (pasada = 0; pasada < 3; pasada++) {
      // medias de temporada sin el efecto estacional actual
      A = [];
      for (k = 0; k < K; k++) {
        var sm = 0, c = 0;
        for (j = 0; j < m; j++) {
          var v = y[k * m + j];
          if (esNum(v)) { sm += mult ? v / s[j] : v - s[j]; c++; }
        }
        A.push(c >= Math.ceil(m / 2) ? sm / c : null);
      }
      // índices estacionales con las medias de temporada
      var tot = 0, nj = 0, tiene = [];
      for (j = 0; j < m; j++) {
        var r = 0, cr = 0;
        for (k = 0; k < K; k++) {
          var w = y[k * m + j];
          if (esNum(w) && A[k] !== null && (!mult || A[k] > 0)) { r += mult ? w / A[k] : w - A[k]; cr++; }
        }
        tiene.push(cr > 0);
        if (cr) { s[j] = r / cr; tot += s[j]; nj++; } else s[j] = mult ? 1 : 0;
      }
      if (!nj) return null;
      for (j = 0; j < m; j++) if (tiene[j]) s[j] = mult ? s[j] / (tot / nj) : s[j] - tot / nj;
      if (mult) for (j = 0; j < m; j++) if (!(s[j] > 0)) return null;
    }
    // nivel (al centro de la temporada 0, como la forma clásica) y tendencia por MCO
    var xs = [], ys = [];
    for (k = 0; k < K; k++) if (A[k] !== null) { xs.push(k); ys.push(A[k]); }
    if (xs.length < 2) return null;
    var mx = media(xs), my = media(ys), sxx = 0, sxy = 0;
    for (k = 0; k < xs.length; k++) { sxx += (xs[k] - mx) * (xs[k] - mx); sxy += (xs[k] - mx) * (ys[k] - my); }
    var pend = sxy / sxx, nivel = my - pend * mx;
    if (mult && !(nivel > 0)) return null;
    return { nivel: nivel, tendencia: pend / m, estacional: s };
  }

  var SEAS_TMP = null;
  /* SSE de un paso; corta en cuanto supera `tope` (poda de la rejilla) */
  function hwSSE(y, n, m, mult, a, b, g, ini, tope) {
    if (!SEAS_TMP || SEAS_TMP.length < m) SEAS_TMP = new Float64Array(m);
    var seas = SEAS_TMP, l = ini.nivel, bb = ini.tendencia, sse = 0, j = 0, t;
    for (t = 0; t < m; t++) seas[t] = ini.estacional[t];
    var a1 = 1 - a, b1 = 1 - b, g1 = 1 - g;
    for (t = 0; t < n; t++) {
      var s = seas[j], lb = l + bb, yt = y[t], f, ln;
      if (mult) {
        if (!(lb > 0) || !(s > 0)) return Infinity;
        f = lb * s;
        if (yt !== yt) yt = f;
        ln = a * yt / s + a1 * lb;
        seas[j] = g * yt / lb + g1 * s;
      } else {
        f = lb + s;
        if (yt !== yt) yt = f;
        ln = a * (yt - s) + a1 * lb;
        seas[j] = g * (yt - lb) + g1 * s;
      }
      var e = yt - f;
      sse += e * e;
      if (sse > tope) return Infinity;
      bb = b * (ln - l) + b1 * bb;
      l = ln;
      if (++j === m) j = 0;
    }
    return sse;
  }

  function hwCorrer(y, m, mult, a, b, g, ini) {
    var n = y.length, seas = new Float64Array(m), l = ini.nivel, bb = ini.tendencia, j = 0, t;
    for (t = 0; t < m; t++) seas[t] = ini.estacional[t];
    var aj = new Array(n), res = new Array(n), sse = 0, rel = 0, nrel = 0;
    for (t = 0; t < n; t++) {
      var s = seas[j], lb = l + bb, yt = y[t], f, ln;
      f = mult ? lb * s : lb + s;
      var falta = yt !== yt;
      if (falta) yt = f;
      if (mult) { ln = a * yt / s + (1 - a) * lb; seas[j] = g * yt / lb + (1 - g) * s; }
      else { ln = a * (yt - s) + (1 - a) * lb; seas[j] = g * (yt - lb) + (1 - g) * s; }
      aj[t] = f;
      res[t] = falta ? null : yt - f;
      if (!falta) { sse += res[t] * res[t]; if (f !== 0) { rel += (res[t] / f) * (res[t] / f); nrel++; } }
      bb = b * (ln - l) + (1 - b) * bb;
      l = ln;
      if (++j === m) j = 0;
    }
    // estado final: el índice estacional para t = n + h − 1 es seas[(n + h − 1) % m]
    return { ajustados: aj, residuos: res, sse: sse, varRel: nrel ? rel / nrel : 0,
      nivel: l, tendencia: bb, estacional: seas, n: n };
  }

  function hwPronostico(est, m, mult, h) {
    var out = [];
    for (var k = 1; k <= h; k++) {
      var s = est.estacional[(est.n + k - 1) % m], lb = est.nivel + k * est.tendencia;
      out.push(mult ? lb * s : lb + s);
    }
    return out;
  }

  function aSerie(y) {
    var x = new Float64Array(y.length);
    for (var i = 0; i < y.length; i++) x[i] = esNum(y[i]) ? y[i] : NaN;
    return x;
  }

  var REJ_A = [0.02, 0.05, 0.1, 0.15, 0.2, 0.3, 0.4, 0.5, 0.65, 0.8, 0.95];
  var REJ_B = [0, 0.01, 0.03, 0.06, 0.1, 0.2, 0.35];
  var REJ_G = [0.01, 0.05, 0.1, 0.2, 0.3, 0.45, 0.6, 0.8];
  function acotar(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  /* búsqueda en rejilla gruesa y luego dos rondas finas alrededor del mejor punto */
  function hwBuscar(x, m, mult) {
    var ini = hwInicial(x, m, mult);
    if (!ini) return null;
    var n = x.length, mejor = { sse: Infinity, a: 0, b: 0, g: 0 }, i, j, k;
    for (i = 0; i < REJ_A.length; i++)
      for (j = 0; j < REJ_B.length; j++)
        for (k = 0; k < REJ_G.length; k++) {
          var s = hwSSE(x, n, m, mult, REJ_A[i], REJ_B[j], REJ_G[k], ini, mejor.sse);
          if (s < mejor.sse) mejor = { sse: s, a: REJ_A[i], b: REJ_B[j], g: REJ_G[k] };
        }
    if (mejor.sse === Infinity) return null;
    var pasos = [[0.05, 0.02, 0.05], [0.02, 0.008, 0.02]], OFF = [-1, -0.5, 0, 0.5, 1];
    for (var r = 0; r < pasos.length; r++) {
      var c = { a: mejor.a, b: mejor.b, g: mejor.g };
      for (i = 0; i < 5; i++) {
        var a = acotar(c.a + OFF[i] * pasos[r][0], 0.005, 0.995);
        for (j = 0; j < 5; j++) {
          var b = acotar(c.b + OFF[j] * pasos[r][1], 0, 0.995);
          for (k = 0; k < 5; k++) {
            var g = acotar(c.g + OFF[k] * pasos[r][2], 0.001, 0.995);
            var s2 = hwSSE(x, n, m, mult, a, b, g, ini, mejor.sse);
            if (s2 < mejor.sse) mejor = { sse: s2, a: a, b: b, g: g };
          }
        }
      }
    }
    mejor.ini = ini;
    return mejor;
  }

  /* Coeficientes ψ de la representación de innovaciones de ETS(A,A,A) (Hyndman et al.
     2008), con los parámetros clásicos traducidos a la forma de corrección del error:
     β* = α·β, γ* = (1 − α)·γ;  ψ_0 = 1,  ψ_j = α + β*·j + γ*·1[j mod m = 0].
     El error a h pasos es e_h = Σ_{i=0}^{h−1} ψ_i·ε_{n+h−i}. */
  function hwPsi(H, m, a, b, g) {
    var be = a * b, ge = (1 - a) * g, psi = [1];
    for (var j = 1; j < H; j++) psi.push(a + be * j + (j % m === 0 ? ge : 0));
    return psi;
  }

  /* varianza del error a h pasos, en unidades de σ²: 1 + Σ_{j=1}^{h−1} ψ_j² */
  function hwVarFactor(h, m, a, b, g) {
    var be = a * b, ge = (1 - a) * g, k = Math.floor((h - 1) / m);
    return 1 + (h - 1) * (a * a + a * be * h + be * be * h * (2 * h - 1) / 6) +
      ge * k * (2 * a + ge + be * m * (k + 1));
  }

  /* Varianza de Σ_h p_h·e_h (p_h = pesos; en el multiplicativo p_h ya va multiplicado por
     el pronóstico del día). Los errores de distintos días comparten las innovaciones, así
     que no se suman como independientes:
       Var = σ²·Σ_{i=1}^{H} ( Σ_{h=i}^{H} p_h·ψ_{h−i} )². */
  function hwVarSuma(pesos, psi, sig2) {
    var H = pesos.length, v = 0;
    for (var i = 1; i <= H; i++) {
      var w = 0;
      for (var h = i; h <= H; h++) if (pesos[h - 1]) w += pesos[h - 1] * psi[h - i];
      v += w * w;
    }
    return sig2 * v;
  }

  /* σ² robusto de los errores de un paso: se descartan los residuos con |z robusto| > 3,5
     (0,6745·|r − mediana|/MAD), para que unos pocos días atípicos no ensanchen todas las
     bandas, y se promedian los cuadrados del resto (con errores normales casi no cambia). */
  function varianzaRobusta(r) {
    if (!r.length) return 0;
    var med = cuantil(r, 0.5), dev = [], i;
    for (i = 0; i < r.length; i++) dev.push(Math.abs(r[i] - med));
    var mad = cuantil(dev, 0.5), sc = 0, c = 0;
    for (i = 0; i < r.length; i++) {
      if (mad > 0 && 0.6745 * dev[i] / mad > 3.5) continue;
      sc += r[i] * r[i]; c++;
    }
    return c ? sc / c : 0;
  }

  /**
   * Holt-Winters con parámetros fijos (útil para pruebas y para reutilizar un ajuste).
   * @param {number[]} y
   * @param {{m?:number, modelo:'aditivo'|'multiplicativo', alfa:number, beta:number,
   *   gamma:number, h?:number, inicial?:{nivel:number, tendencia:number, estacional:number[]}}} op
   * @returns {{ajustados:number[], residuos:Array<number|null>, sse:number, rmse:number,
   *   inicial:Object, nivel:number, tendencia:number, estacional:number[],
   *   pronostico:number[]}|null}
   */
  function holtWintersAjustar(y, op) {
    var m = op.m || 7, mult = op.modelo === 'multiplicativo', x = aSerie(y);
    var ini = op.inicial || hwInicial(x, m, mult);
    if (!ini) return null;
    var est = hwCorrer(x, m, mult, op.alfa, op.beta, op.gamma, ini);
    var nv = 0;
    for (var i = 0; i < est.residuos.length; i++) if (est.residuos[i] !== null) nv++;
    return { ajustados: est.ajustados, residuos: est.residuos, sse: est.sse,
      rmse: nv ? Math.sqrt(est.sse / nv) : null,
      inicial: { nivel: ini.nivel, tendencia: ini.tendencia, estacional: Array.prototype.slice.call(ini.estacional) },
      nivel: est.nivel, tendencia: est.tendencia, estacional: Array.prototype.slice.call(est.estacional),
      pronostico: hwPronostico(est, m, mult, op.h || 0) };
  }

  /**
   * Pronóstico Holt-Winters con tendencia aditiva y estacionalidad (m = 7 por defecto).
   * Prueba el modelo aditivo y el multiplicativo (este solo si la serie lo permite),
   * busca α, β y γ en una rejilla gruesa y luego fina minimizando la suma de errores
   * cuadráticos de un paso, y elige el de menor RMSE.
   * Intervalos: σ² robusta de los errores de un paso (sin los residuos con |z robusto| > 3,5)
   * escalada por horizonte con la fórmula de Hyndman para ETS(A,A,A); en el multiplicativo la
   * misma fórmula sobre el error relativo (residuo/ajustado), multiplicada por el pronóstico.
   * Bandas ≥ 0. varSuma(pesos) da la varianza de Σ pesos[h−1]·error_h con la fórmula de
   * innovaciones (los errores de días distintos están correlacionados): úsese para bandas
   * de sumas de días (cierre del mes, acumulados).
   * mape28: ajusta (con nueva búsqueda) sin los últimos 28 días y pronostica esos 28.
   * @param {number[]} y serie diaria sin huecos (null se trata como dato faltante)
   * @param {{m?:number, h?:number, validacion?:number}} [opciones] m = 7, h = 14, validacion = 28
   * @returns {{modelo:string, alfa:number, beta:number, gamma:number, ajustados:number[],
   *   rmse:number, mape28:number|null, rmseAditivo:number|null, rmseMultiplicativo:number|null,
   *   pronostico:Array<{h:number, valor:number, sd:number, lo80:number, hi80:number,
   *   lo95:number, hi95:number}>, sigma2:number, varSuma:function(number[]):number}|null} null si hay menos de 2 temporadas + 2 días. mape28 en %.
   */
  function holtWinters(y, opciones) {
    opciones = opciones || {};
    var m = opciones.m || 7, H = opciones.h || 14, V = opciones.validacion || 28;
    var x = aSerie(y), n = x.length;
    if (n < 2 * m + 2) return null;
    var cand = [], tipos = ['aditivo', 'multiplicativo'], i;
    for (i = 0; i < 2; i++) {
      var mb = hwBuscar(x, m, i === 1);
      if (mb) cand.push({ modelo: tipos[i], mult: i === 1, b: mb });
    }
    if (!cand.length) return null;
    var nv = 0;
    for (i = 0; i < n; i++) if (x[i] === x[i]) nv++;
    var rmA = null, rmM = null, mejor = null;
    for (i = 0; i < cand.length; i++) {
      cand[i].rmse = Math.sqrt(cand[i].b.sse / nv);
      if (cand[i].mult) rmM = cand[i].rmse; else rmA = cand[i].rmse;
      if (!mejor || cand[i].rmse < mejor.rmse) mejor = cand[i];
    }
    var p = mejor.b, est = hwCorrer(x, m, mejor.mult, p.a, p.b, p.g, p.ini);
    var fc = hwPronostico(est, m, mejor.mult, H);
    // errores de un paso (relativos en el multiplicativo) con σ² robusto
    var errs = [];
    for (i = 0; i < n; i++) {
      var ri = est.residuos[i];
      if (ri === null) continue;
      if (mejor.mult) { if (est.ajustados[i] !== 0) errs.push(ri / est.ajustados[i]); }
      else errs.push(ri);
    }
    var sig2 = varianzaRobusta(errs), psi = hwPsi(H, m, p.a, p.b, p.g);
    var z80 = normInv(0.9), z95 = normInv(0.975), pron = [];
    for (var h = 1; h <= H; h++) {
      var v = fc[h - 1], sd = Math.sqrt(sig2 * hwVarFactor(h, m, p.a, p.b, p.g));
      if (mejor.mult) sd *= Math.abs(v);
      pron.push({ h: h, valor: Math.max(0, v), sd: sd,
        lo80: Math.max(0, v - z80 * sd), hi80: Math.max(0, v + z80 * sd),
        lo95: Math.max(0, v - z95 * sd), hi95: Math.max(0, v + z95 * sd) });
    }
    var esMult = mejor.mult;
    /* varianza de una suma ponderada de días del pronóstico (pesos[h−1] para el día h) */
    function varSuma(pesos) {
      var q = [];
      for (var hh = 0; hh < Math.min(pesos.length, H); hh++) {
        var ph = esNum(pesos[hh]) ? pesos[hh] : 0;
        q.push(esMult ? ph * Math.abs(fc[hh]) : ph);
      }
      return hwVarSuma(q, psi, sig2);
    }
    // validación fuera de muestra
    var mape = null;
    if (n - V >= 2 * m + 2 + m) {
      var xt = x.subarray(0, n - V), bv = hwBuscar(xt, m, mejor.mult);
      if (bv) {
        var ev = hwCorrer(xt, m, mejor.mult, bv.a, bv.b, bv.g, bv.ini);
        var fv = hwPronostico(ev, m, mejor.mult, V), se = 0, ne = 0;
        for (i = 0; i < V; i++) {
          var real = x[n - V + i];
          if (real === real && real > 0) { se += Math.abs(real - Math.max(0, fv[i])) / real; ne++; }
        }
        mape = ne ? se / ne * 100 : null;
      }
    }
    return { modelo: mejor.modelo, alfa: p.a, beta: p.b, gamma: p.g, ajustados: est.ajustados,
      rmse: mejor.rmse, mape28: mape, rmseAditivo: rmA, rmseMultiplicativo: rmM, pronostico: pron,
      sigma2: sig2, varSuma: varSuma };
  }

  function mediana(arr) { return cuantil(arr, 0.5); }

  function indicesSemana(fechasISO, y) {
    var perfil = perfilSemanal(fechasISO, y), ind = [];
    for (var d = 0; d < 7; d++) ind.push(perfil[d].indice !== null && perfil[d].indice > 0 ? perfil[d].indice / 100 : 1);
    return ind;
  }

  /**
   * Días atípicos. Esperado = media móvil centrada (28 días; 7 si hay menos de 84 datos)
   * de la serie desestacionalizada × índice del día de semana / 100. En los extremos,
   * donde la ventana no está completa, se usa la media de los datos disponibles de la
   * ventana (al menos la mitad). Residuo = valor − esperado; z robusto =
   * 0,6745·(residuo − mediana)/MAD; atípico si |z| > 3,5.
   * @param {string[]} fechasISO  @param {number[]} y
   * @returns {Array<{i:number, fecha:string, valor:number, esperado:number, z:number,
   *   dif:number, difPct:number|null}>} en orden cronológico; difPct en %.
   */
  function atipicos(fechasISO, y) {
    var n = y.length, i, j;
    var nv = limpios(y).length;
    if (nv < 14) return [];
    var k = nv >= 84 ? 28 : 7, ind = indicesSemana(fechasISO, y), dw = [], des = [];
    for (i = 0; i < n; i++) { dw.push(diaSemana(fechasISO[i])); des.push(esNum(y[i]) ? y[i] / ind[dw[i]] : null); }
    var atras = Math.ceil((k - 1) / 2), adel = k - 1 - atras, esp = [], res = [], idx = [];
    for (i = 0; i < n; i++) {
      if (!esNum(y[i])) { esp.push(null); continue; }
      var s = 0, c = 0;
      for (j = Math.max(0, i - atras); j <= Math.min(n - 1, i + adel); j++) if (des[j] !== null) { s += des[j]; c++; }
      if (c < k / 2) { esp.push(null); continue; }
      var e = s / c * ind[dw[i]];
      esp.push(e); res.push(y[i] - e); idx.push(i);
    }
    if (res.length < 7) return [];
    var med = mediana(res), dev = [];
    for (i = 0; i < res.length; i++) dev.push(Math.abs(res[i] - med));
    var mad = mediana(dev), out = [];
    if (!(mad > 0)) return [];
    for (i = 0; i < res.length; i++) {
      var z = 0.6745 * (res[i] - med) / mad;
      if (Math.abs(z) > 3.5) {
        var ii = idx[i];
        out.push({ i: ii, fecha: fechasISO[ii], valor: y[ii], esperado: esp[ii], z: z,
          dif: y[ii] - esp[ii], difPct: esp[ii] ? (y[ii] - esp[ii]) / esp[ii] * 100 : null });
      }
    }
    return out;
  }

  /* Base ortonormal (Gram-Schmidt modificado) de {1, t, t²} sobre las posiciones t, para
     descontar una tendencia suave (recta con curvatura). */
  function baseTendencia(pos, grado) {
    var n = pos.length, tm = media(pos), esc = 0, Q = [], i, j, c;
    for (i = 0; i < n; i++) esc = Math.max(esc, Math.abs(pos[i] - tm));
    esc = esc || 1;
    for (c = 0; c <= grado; c++) {
      var v = new Float64Array(n);
      for (i = 0; i < n; i++) v[i] = Math.pow((pos[i] - tm) / esc, c);
      for (j = 0; j < Q.length; j++) {
        var pr = 0;
        for (i = 0; i < n; i++) pr += v[i] * Q[j][i];
        for (i = 0; i < n; i++) v[i] -= pr * Q[j][i];
      }
      var nr = 0;
      for (i = 0; i < n; i++) nr += v[i] * v[i];
      nr = Math.sqrt(nr);
      if (!(nr > 1e-9)) return null;
      for (i = 0; i < n; i++) v[i] /= nr;
      Q.push(v);
    }
    return Q;
  }

  /* residuos de v sin la tendencia (proyección sobre la base Q); devuelve su suma de cuadrados */
  function sinTendencia(v, Q, out) {
    var n = v.length, i, j, ss = 0;
    for (i = 0; i < n; i++) out[i] = v[i];
    for (j = 0; j < Q.length; j++) {
      var pr = 0;
      for (i = 0; i < n; i++) pr += v[i] * Q[j][i];
      for (i = 0; i < n; i++) out[i] -= pr * Q[j][i];
    }
    for (i = 0; i < n; i++) ss += out[i] * out[i];
    return ss;
  }

  /* Barrido del punto de cambio sobre los residuos u de la tendencia (Frisch-Waugh):
     agregar el escalón D_k = 1[i ≥ k] reduce la suma de cuadrados en U_k²/q_k, con
     U_k = Σ_{i≥k} u_i y q_k = (n − k) − Σ_j (Σ_{i≥k} Q_j[i])² (parte del escalón que la
     tendencia no explica). */
  function barridoCambio(u, Q, MIN) {
    var n = u.length, p = Q.length, U = 0, T = new Float64Array(p), k, j;
    var mejor = { k: -1, gan: -Infinity, U: 0, q: 0 };
    for (k = n - 1; k >= MIN; k--) {
      U += u[k];
      for (j = 0; j < p; j++) T[j] += Q[j][k];
      if (k > n - MIN) continue;
      var q = n - k;
      for (j = 0; j < p; j++) q -= T[j] * T[j];
      if (!(q > 1e-9)) continue;
      var gan = U * U / q;
      if (gan > mejor.gan) mejor = { k: k, gan: gan, U: U, q: q };
    }
    return mejor;
  }

  /**
   * Punto único de cambio de nivel en la serie desestacionalizada (y / índice semanal),
   * descontada una tendencia suave (recta con curvatura, MCO): un crecimiento gradual no
   * cuenta como cambio de nivel. Elige el corte (al menos 21 días por lado) que más
   * reduce la suma de cuadrados al agregar un escalón a la tendencia. Como el corte se
   * elige buscando el máximo, una prueba t común daría falsos positivos; el valor p sale
   * de un bootstrap por bloques circulares (bloques de ≥ 14 días, que conservan la
   * autocorrelación y el patrón semanal) de los residuos, repitiendo la búsqueda en cada
   * réplica (semilla fija: resultado determinista). Hay cambio si p < 0,01 y el salto es
   * de al menos 5 %.
   * @param {string[]} fechasISO  @param {number[]} y
   * @param {{replicas?:number, alfa?:number, efectoMin?:number}} [opciones]
   *   replicas = 299, alfa = 0,01, efectoMin = 0,05.
   * @returns {{hay:boolean, i:number|null, fecha:string|null, mediaAntes:number|null,
   *   mediaDespues:number|null, salto:number|null, saltoPct:number|null,
   *   nivelAntes:number|null, nivelDespues:number|null, nivel:Array<number|null>|null,
   *   p:number|null}}
   *   i = primer índice del tramo nuevo; mediaAntes/mediaDespues = medias de cada tramo y

        S.timer = setTimeout(pedirHistorico, Math.min(120000, 3000 * Math.pow(2, S.sinAvance)));
      } else S.sinAvance = 0;
      S.faltanAntes = r.datos.faltan;
      dibujar();
    }).catch(function (e) {
      S.cargando = false;
      // Solo se muestran los mensajes propios; cualquier otro fallo (por ejemplo, de cálculo) se resume.
      S.error = e && e.propio ? e.message : ERR_SERVIDOR;
      // Con datos parciales se sigue intentando; sin datos se ofrece reintentar.
      if (S.datos && S.datos.faltan > 0) S.timer = setTimeout(pedirHistorico, 10000);
      dibujar();
    });
  }

  var promesaChart = null;
  function cargarChart() {
    if (window.Chart) { configurarChart(); return Promise.resolve(); }
    if (promesaChart) return promesaChart;
    promesaChart = new Promise(function (ok, mal) {
      var s = document.createElement('script');
      s.src = URL_CHART;
      s.async = true;
      s.onload = function () { configurarChart(); ok(); };
      s.onerror = function () { promesaChart = null; s.remove(); mal(new Error('No se pudo cargar la librería de gráficas')); };
      document.head.appendChild(s);
    });
    return promesaChart;
  }
  var chartListo = false;
  function configurarChart() {
    if (chartListo || !window.Chart) return;
    chartListo = true;
    var D = Chart.defaults;
    D.font.family = "Inter,'Segoe UI',Roboto,Arial,sans-serif";
    D.font.size = 11;
    D.color = C.sec;
    D.locale = 'es-VE';
    D.animation = false;
    D.responsive = true;
    D.maintainAspectRatio = false;
    D.plugins.legend.display = false;
    D.plugins.tooltip.backgroundColor = 'rgba(20,22,31,.92)';
    D.plugins.tooltip.padding = 9;
    D.plugins.tooltip.cornerRadius = 8;
    D.plugins.tooltip.boxPadding = 4;
    D.plugins.tooltip.titleFont = { weight: '600', size: 12 };
    D.plugins.tooltip.bodyFont = { size: 12 };
    D.elements.line.borderWidth = 2;
    D.elements.point.radius = 0;
    D.elements.point.hoverRadius = 4;
  }

  /* ============================== pestañas ============================== */

  function iniciar() {
    var barra = document.getElementById('pestanas');
    if (!barra) return;
    // Se guarda la última respuesta del modo json (para el reparto convenio/farmacia de hoy y la proyección del mes).
    var pintarOriginal = window.pintar;
    if (typeof pintarOriginal === 'function') {
      window.pintar = function (d) { S.hoy = d; var r = pintarOriginal.apply(this, arguments); alActualizarHoy(); return r; };
    }
    if (window.DATOS_PRUEBA) S.hoy = window.DATOS_PRUEBA;
    barra.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-tab]');
      if (b) mostrar(b.getAttribute('data-tab'));
    });
    try {
      var p = localStorage.getItem('fact.periodo'); if (p && /^(30|90|365|todo)$/.test(p)) S.periodo = p;
      if (localStorage.getItem('fact.iva') === '0') S.iva = false;
    } catch (e) {}
    var t = 'hoy';
    try { t = localStorage.getItem('fact.pestana') || 'hoy'; } catch (e) {}
    if (PESTANAS.indexOf(t) < 0) t = 'hoy';
    mostrar(t, true);
    var vista = document.getElementById('vistaHist');
    vista.addEventListener('click', alTocar);
    vista.addEventListener('change', alCambiar);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && S.tab !== 'hoy' && S.cargadoEn && Date.now() - S.cargadoEn > UNA_HORA) pedirHistorico();
    });
  }

  function alActualizarHoy() {
    // Corre con cada recarga del modo json (cada minuto).
    // 1) Con la página abierta en una pestaña del histórico, se refresca si pasó más de 1 hora o cambió el día.
    //    Si un intento falla, se espera al menos 5 minutos antes del siguiente.
    if (S.tab !== 'hoy' && !S.cargando && S.cargadoEn && Date.now() - S.intentoEn > 300000) {
      var dia = S.hoy && S.hoy.hoy;
      var cambioDia = dia && (S.cargadoPara ? dia !== S.cargadoPara : S.datos && S.datos.hasta && dia > Est.sumarDias(S.datos.hasta, 1));
      if (Date.now() - S.cargadoEn > UNA_HORA || cambioDia) { pedirHistorico(); return; }
    }
    // 2) Solo se redibuja lo que usa el dato de hoy y ya está pintado (sin recalcular todo cada minuto).
    if (!S.prep || !window.Chart) return;
    if (S.tab === 'pronostico') dibujar(true);
    else if (S.tab === 'historico') {
      var vista = document.getElementById('vistaHist'), viejo = vista && vista.querySelector('.hrep'), nuevo = repartoHoy();
      if (viejo && nuevo) viejo.outerHTML = nuevo;
      else if (viejo || nuevo) dibujar(true);
    }
  }

  function mostrar(t, inicial) {
    S.tab = t;
    try { localStorage.setItem('fact.pestana', t); } catch (e) {}
    var botones = document.querySelectorAll('#pestanas button');
    for (var i = 0; i < botones.length; i++) {
      var act = botones[i].getAttribute('data-tab') === t;
      botones[i].className = act ? 'activa' : '';
      botones[i].setAttribute('aria-selected', act ? 'true' : 'false');
    }
    var vista = document.getElementById('vistaHist'), cont = document.getElementById('contenido');
    destruirGraficas();
    if (t === 'hoy') { vista.hidden = true; vista.innerHTML = ''; cont.style.display = ''; return; }
    cont.style.display = 'none';
    vista.hidden = false;
    if ((!S.datos && !S.cargando) || (S.cargadoEn && Date.now() - S.cargadoEn > UNA_HORA && !S.cargando)) pedirHistorico();
    if (!inicial) window.scrollTo(0, 0);
    dibujar();
  }

  function destruirGraficas() {
    S.charts.forEach(function (c) { try { c.destroy(); } catch (e) {} });
    S.charts = [];
  }

  /* Dibuja la pestaña visible con el estado actual (carga, avance, error o datos). */
  function dibujar(silencioso) {
    if (S.tab === 'hoy') return;
    var vista = document.getElementById('vistaHist');
    if (!S.prep) {
      destruirGraficas();
      if (S.error && !S.cargando) {
        vista.innerHTML = '<div class="hestado err">No pude traer el histórico: ' + esc(S.error) + '.<br>' +
          '<button type="button" data-accion="reintentar">Reintentar</button></div>';
      } else if (S.datos && S.datos.faltan > 0) {
        // Llegó una respuesta sin días todavía: se muestra el avance real de la carga.
        vista.innerHTML = avance() + '<div class="hestado">Todavía no hay días con ventas cargados; se mostrarán apenas lleguen.</div>';
      } else if (S.datos) {
        vista.innerHTML = '<div class="hestado">Todavía no hay días con ventas en el histórico.</div>' +
          (S.error ? '<div class="haviso">No pude actualizar el histórico: ' + esc(S.error) + '.</div>' : '');
      } else {
        vista.innerHTML = '<div class="hestado"><span class="hgiro"></span>Cargando el histórico de Plade…</div>';
      }
      return;
    }
    if (!window.Chart) {
      if (!silencioso) {
        destruirGraficas();
        vista.innerHTML = avance() + '<div class="hestado"><span class="hgiro"></span>Preparando las gráficas…</div>';
      }
      cargarChart().then(function () { dibujar(); }, function (e) {
        vista.innerHTML = '<div class="hestado err">' + esc(e.message) + '. Revise la conexión.<br>' +
          '<button type="button" data-accion="reintentar-graficas">Reintentar</button></div>';
      });
      return;
    }
    var y = window.scrollY;
    destruirGraficas();
    var t0 = performance.now(), graficas = [], html;
    if (S.tab === 'historico') html = vistaHistorico(graficas);
    else if (S.tab === 'sucursales') html = vistaSucursales(graficas);
    else html = vistaPronostico(graficas);
    vista.innerHTML = avance() + html;
    graficas.forEach(function (g) {
      var cv = document.getElementById(g.id);
      (g.cfg.data.datasets || []).forEach(function (d) { if (d.backgroundColor === undefined && typeof d.borderColor === 'string') d.backgroundColor = d.borderColor; });
      if (cv) S.charts.push(new Chart(cv, g.cfg));
    });
    if (S.tab === 'historico') { var cal = vista.querySelector('.hcal'); if (cal) cal.scrollLeft = cal.scrollWidth; }
    S.ultimoCalculoMs = performance.now() - t0;
    vista.setAttribute('data-ms', S.ultimoCalculoMs.toFixed(1));
    if (silencioso) window.scrollTo(0, y);
  }

  function avance() {
    var d = S.datos, h = '';
    if (d && d.faltan > 0) {
      var total = Math.max(1, Est.difDias(HIST_DESDE, d.hasta) + 1);
      var p = Math.max(0, Math.min(99, Math.floor((total - d.faltan) / total * 100)));
      h += '<div class="havance"><span class="hgiro"></span>Cargando el histórico de Plade: ' + p + ' %.' + (S.prep ? ' Se muestra lo ya cargado.' : '') +
        '<div class="barra"><i style="width:' + p + '%"></i></div></div>';
    }
    if (S.error && S.datos) h += '<div class="haviso">No pude actualizar el histórico: ' + esc(S.error) + '. Se muestran los últimos datos recibidos.</div>';
    return h;
  }

  function alTocar(e) {
    var el = e.target.closest('[data-accion]');
    if (el) {
      var acc = el.getAttribute('data-accion');
      if (acc === 'reintentar') { S.error = null; pedirHistorico(); dibujar(); }
      else if (acc === 'reintentar-graficas') dibujar();
      else if (acc === 'periodo') { S.periodo = el.getAttribute('data-v'); guardarPref(); dibujar(true); }
      else if (acc === 'iva') { S.iva = el.getAttribute('data-v') === '1'; guardarPref(); dibujar(true); }
      else if (acc === 'ordenar') {
        var col = el.getAttribute('data-col');
        S.orden = S.orden.col === col ? { col: col, dir: -S.orden.dir } : { col: col, dir: col === 'nombre' ? 1 : -1 };
        dibujar(true);
      } else if (acc === 'suc') {
        S.sucSel = el.getAttribute('data-id');
        dibujar(true);
        var det = document.getElementById('hdetalle');
        if (det) det.scrollIntoView({ block: 'start', behavior: 'smooth' });
      }
      return;
    }
    var r = e.target.closest('rect[data-i]');
    if (r) {
      var caja = r.closest('[data-info]'), info = caja && document.getElementById(caja.getAttribute('data-info'));
      if (info) info.textContent = r.getAttribute('data-t');
    }
  }
  function alCambiar(e) {
    if (e.target.id === 'hselSuc') { S.sucSel = e.target.value; dibujar(true); }
  }
  function guardarPref() {
    try { localStorage.setItem('fact.periodo', S.periodo); localStorage.setItem('fact.iva', S.iva ? '1' : '0'); } catch (e) {}
  }

  /* ============================== piezas de la vista ============================== */

  function tarjeta(titulo, exp, cuerpo, extra) {
    extra = extra || '';
    var m = extra.match(/class="([^"]*)"/), cls = m ? m[1] : 'ht';
    extra = extra.replace(/\s*class="[^"]*"/, '');
    return '<section class="' + cls + '"' + extra + '><h2>' + titulo + '</h2>' + (exp ? '<p class="hexp">' + exp + '</p>' : '') + cuerpo + '</section>';
  }
  function lienzo(graficas, alto, cfg) {
    var id = 'hg' + graficas.length + '_' + Math.random().toString(36).slice(2, 7);
    graficas.push({ id: id, cfg: cfg });
    return '<div class="hgraf" style="height:' + alto + 'px"><canvas id="' + id + '" role="img"></canvas></div>';
  }
  function controles(w) {
    var P = S.prep, h = '<div class="hctl"><div class="hseg" role="group" aria-label="Período">';
    PERIODOS.forEach(function (p) {
      h += '<button type="button" data-accion="periodo" data-v="' + p[0] + '" class="' + (S.periodo === p[0] ? 'activa' : '') + '">' + p[1] + '</button>';
    });
    h += '</div><div class="hctl2"><span>' + fechaDMA(P.fechas[w.a]) + ' al ' + fechaDMA(P.fechas[w.b]) + '</span>' +
      '<div class="hseg" role="group" aria-label="IVA">' +
      '<button type="button" data-accion="iva" data-v="1" class="' + (S.iva ? 'activa' : '') + '">Con IVA</button>' +
      '<button type="button" data-accion="iva" data-v="0" class="' + (!S.iva ? 'activa' : '') + '">Sin IVA</button></div></div></div>';
    return h;
  }
  function rangoTxt(r) { return fechaDM(S.prep.fechas[r.a]) + ' al ' + fechaDM(S.prep.fechas[r.b]) + '/' + S.prep.fechas[r.b].slice(2, 4); }

  /* Opciones comunes de las gráficas */
  function ejeY(fmt, extra) {
    return Object.assign({ grid: { color: C.rejilla, drawTicks: false }, border: { display: false },
      ticks: { color: C.sec, padding: 6, maxTicksLimit: 6, callback: fmt || function (v) { return usdCorto(v); } } }, extra || {});
  }
  function ejeX(extra) {
    return Object.assign({ grid: { display: false }, border: { color: C.borde },
      ticks: { color: C.sec, maxRotation: 0, autoSkip: true, autoSkipPadding: 14 } }, extra || {});
  }
  // Los 7 días de la semana caben siempre: no se salta ninguna etiqueta.
  function ejeSemana() { return ejeX({ ticks: { color: C.sec, maxRotation: 0, autoSkip: false } }); }
  function leyenda(filtro) {
    return { display: true, position: 'bottom', align: 'start',
      labels: { boxWidth: 10, boxHeight: 10, padding: 10, usePointStyle: false, font: { size: 11 },
        sort: function (x, y) { return x.datasetIndex - y.datasetIndex; },
        filter: filtro || function (it) { return !/^_/.test(it.text); } } };
  }
  function tipUsd(ctx) { return ' ' + ctx.dataset.label + ': ' + usd(ctx.parsed.y); }
  function alfa(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  // Con más de 12 meses en pantalla, las fechas llevan el año (1/4/25), porque el rango abarca dos años.
  function etiquetasFechas(a, b) {
    var out = [], anio = b - a + 1 > 366;
    for (var i = a; i <= b; i++) { var f = S.prep.fechas[i]; out.push(fechaDM(f) + (anio ? '/' + f.slice(2, 4) : '')); }
    return out;
  }

  /* Bigotes (rango intercuartílico) sobre barras: plugin local */
  function pluginBigotes(lo, hi) {
    return { id: 'bigotes', afterDatasetsDraw: function (ch) {
      var meta = ch.getDatasetMeta(0), y = ch.scales.y, cx = ch.ctx;
      cx.save(); cx.strokeStyle = C.tinta; cx.lineWidth = 1.5;
      meta.data.forEach(function (el, i) {
        if (!esNum(lo[i]) || !esNum(hi[i])) return;
        var y1 = y.getPixelForValue(lo[i]), y2 = y.getPixelForValue(hi[i]), w = Math.min(10, el.width / 3);
        cx.beginPath(); cx.moveTo(el.x, y1); cx.lineTo(el.x, y2);
        cx.moveTo(el.x - w, y1); cx.lineTo(el.x + w, y1); cx.moveTo(el.x - w, y2); cx.lineTo(el.x + w, y2);
        cx.stroke();
      });
      cx.restore();
    } };
  }

  /* Minigráfica SVG (sparkline) */
  /* Nombre largo en dos líneas (cortado en el espacio más cercano a la mitad), en vez de truncarlo con «…». */
  function dosLineas(n, max) {
    if (n.length <= max) return n;
    var mejor = -1;
    for (var i = 1; i < n.length - 1; i++) if (n[i] === ' ' && (mejor < 0 || Math.abs(i - n.length / 2) < Math.abs(mejor - n.length / 2))) mejor = i;
    if (mejor < 0) return n.length > max + 4 ? n.slice(0, max + 3) + '…' : n;
    var a = n.slice(0, mejor), b = n.slice(mejor + 1);
    return [a, b.length > max + 4 ? b.slice(0, max + 3) + '…' : b];
  }
  function sparkline(vals, ancho, alto) {
    var pts = [], mn = Infinity, mx = -Infinity, i;
    for (i = 0; i < vals.length; i++) if (esNum(vals[i])) { mn = Math.min(mn, vals[i]); mx = Math.max(mx, vals[i]); }
    if (!isFinite(mn)) return '';
    var r = mx - mn || 1, n = vals.length;
    for (i = 0; i < n; i++) if (esNum(vals[i])) pts.push((n > 1 ? i / (n - 1) * (ancho - 2) + 1 : ancho / 2).toFixed(1) + ',' + (alto - 2 - (vals[i] - mn) / r * (alto - 4)).toFixed(1));
    return '<svg width="' + ancho + '" height="' + alto + '" viewBox="0 0 ' + ancho + ' ' + alto + '" aria-hidden="true">' +
      '<polyline fill="none" stroke="' + C.azul + '" stroke-width="1.5" stroke-linejoin="round" points="' + pts.join(' ') + '"/></svg>';
  }

  function colorSecuencial(t) { // 0 → azul muy claro, 1 → azul principal
    t = Math.max(0, Math.min(1, t));
    var a = [232, 238, 255], b = [29, 78, 216];
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' + Math.round(a[1] + (b[1] - a[1]) * t) + ',' + Math.round(a[2] + (b[2] - a[2]) * t) + ')';
  }
  function colorDivergente(r) { // −1 naranja ↔ 0 gris ↔ +1 azul
    if (!esNum(r)) return '#F3F4F8';
    var g = [229, 231, 235], c = r >= 0 ? [29, 78, 216] : [235, 104, 52], t = Math.min(1, Math.abs(r));
    return 'rgb(' + Math.round(g[0] + (c[0] - g[0]) * t) + ',' + Math.round(g[1] + (c[1] - g[1]) * t) + ',' + Math.round(g[2] + (c[2] - g[2]) * t) + ')';
  }

  /* ============================== HISTÓRICO ============================== */

  function vistaHistorico(G) {
    var P = S.prep, w = ventana(), act = indicadores(w.a, w.b);
    var ant = w.ant ? indicadores(w.ant.a, w.ant.b) : null, anio = w.anio ? indicadores(w.anio.a, w.anio.b) : null;
    var h = controles(w);
    var ivaTxt = S.iva ? 'con IVA' : 'sin IVA';

    /* 1. Tarjetas */
    var res = '<div class="hgrande">' + usd(act.venta) + '</div>' +
      '<div class="hcomp"><span>Frente al período anterior' + (w.ant ? ' (' + rangoTxt(w.ant) + ')' : '') + '</span>' +
      (ant ? chip(act.venta, ant.venta) : '<span class="hchip">sin datos</span>') + '</div>' +
      '<div class="hcomp"><span>Frente al mismo período del año anterior</span>' +
      (anio ? chip(act.venta, anio.venta) : '<span class="hchip">sin datos</span>') + '</div>';
    h += tarjeta('Venta del período', 'Total facturado ' + ivaTxt + ' en ' + act.dias + ' días con ventas. El año anterior se alinea por día de la semana.', res, ' class="ht hres"');

    function k(et, val, a1, a0, tipo, sub, neutro) {
      return '<div class="hk"><div class="e">' + et + '</div><div class="v">' + val + '</div>' + (sub ? '<div class="s">' + sub + '</div>' : '') +
        (ant ? chip(a1, a0, tipo, neutro) : '') + '</div>';
    }
    var g = '<div class="hgrid">' +
      k('Promedio diario', usd(act.media), act.media, ant && ant.media) +
      k('Mediana diaria', usd(act.mediana), act.mediana, ant && ant.mediana) +
      k('Desviación estándar', usd(act.desv), act.desv, ant && ant.desv, 'usd', null, true) +
      k('Coeficiente de variación', act.cv !== null ? pct(act.cv) : '—', act.cv, ant && ant.cv, 'pp', null, true) +
      k('Mejor día', act.mejor ? usd(act.mejor.v) : '—', act.mejor && act.mejor.v, ant && ant.mejor && ant.mejor.v, 'usd', act.mejor ? fechaLarga(act.mejor.f) : '') +
      k('Peor día', act.peor ? usd(act.peor.v) : '—', act.peor && act.peor.v, ant && ant.peor && ant.peor.v, 'usd', act.peor ? fechaLarga(act.peor.f) : '') +
      k('Tickets', num(act.tk), act.tk, ant && ant.tk, 'ent') +
      k('Ticket promedio', usd(act.ticket, true), act.ticket, ant && ant.ticket, 'usd2') +
      k('Unidades por ticket', num(act.upt, 2), act.upt, ant && ant.upt, 'num2') +
      k('Precio promedio por unidad', usd(act.precio, true), act.precio, ant && ant.precio, 'usd2') +
      '</div>';
    h += tarjeta('Indicadores del período', (S.periodo === 'todo' ? 'Con «Todo» no hay un período anterior para comparar. ' : ant ? 'Cada variación compara con el período anterior de igual largo. ' : 'El período anterior no tiene datos completos para comparar. ') + 'La desviación estándar mide cuánto se alejan los días del promedio; el coeficiente de variación la expresa en %.', g);

    /* 2. Venta diaria con medias móviles y atípicos */
    var v = serie('venta'), ab = serie('abiertos');
    // Los días cerrados (null) no borran la ventana: se promedian los días abiertos si hay al menos el 70 %.
    var mm7 = memo('mm7', function () { return Est.mediaMovil(ab, 7, false, 0.7); });
    var mm28 = memo('mm28', function () { return Est.mediaMovil(ab, 28, false, 0.7); });
    var atip = memo('atip', function () { return Est.atipicos(P.fechas, ab); });
    var atipPorI = {};
    atip.forEach(function (x) { atipPorI[x.i] = x; });
    var etq = etiquetasFechas(w.a, w.b), dV = [], d7 = [], d28 = [], dA = [];
    for (var i = w.a; i <= w.b; i++) {
      dV.push(v[i]); d7.push(mm7[i]); d28.push(mm28[i]);
      dA.push(atipPorI[i] ? v[i] : null);
    }
    var nAt = dA.filter(function (x) { return x !== null; }).length;
    h += tarjeta('Venta diaria', 'Cada día con su promedio de los últimos 7 y 28 días. Los puntos rojos son días atípicos' + (nAt ? ' (' + nAt + ' en el período)' : '') + ': se apartan mucho de lo esperado para ese día.',
      lienzo(G, 250, {
        type: 'line',
        data: { labels: etq, datasets: [
          { label: 'Venta diaria', data: dV, borderColor: alfa(C.azul, dV.length > 120 ? 0.22 : 0.35), borderWidth: dV.length > 120 ? 1 : 1.5, backgroundColor: alfa(C.azul, 0.35), order: 3 },
          { label: 'Media 7 días', data: d7, borderColor: C.azul, order: 2 },
          { label: 'Media 28 días', data: d28, borderColor: C.gris, order: 1 },
          { label: 'Atípico', data: dA, showLine: false, pointRadius: 4, pointHoverRadius: 6, pointBackgroundColor: C.rojo, pointBorderColor: '#fff', pointBorderWidth: 1.5, borderColor: C.rojo, backgroundColor: C.rojo, order: 0 }
        ] },
        options: { interaction: { mode: 'index', intersect: false },
          plugins: { legend: leyenda(), tooltip: { callbacks: {
            title: function (it) { return fechaLarga(P.fechas[w.a + it[0].dataIndex]); },
            label: function (c) {
              if (c.datasetIndex === 3) {
                var x = atipPorI[w.a + c.dataIndex];
                return x ? ' Atípico: esperado ' + usd(x.esperado) + ', diferencia ' + textoVar(x.dif, x.difPct) : null;
              }

            } } } },
          scales: { x: ejeX(), y: ejeY() } }

    /* 3. Convenio y farmacia, por día */
    h += seccionConvenio(G, w, act, ant);

    /* 4. Venta por mes */
    h += seccionMeses(G, w);

    /* 5. Perfil por día de la semana */
    var fa = [], ya = [];
    for (i = w.a; i <= w.b; i++) if (ab[i] !== null) { fa.push(P.fechas[i]); ya.push(ab[i]); }

    var dias = '<div class="hdias">' + ORDEN_SEM.map(function (d, j) { return '<div>' + DSEM_C[d] + '<b>' + (pi[j] !== null ? num(pi[j]) : '—') + '</b></div>'; }).join('') + '</div>';
    h += tarjeta('Perfil por día de la semana', 'Venta media de cada día; la línea vertical marca el rango donde cae la mitad central de esos días.',
      lienzo(G, 210, {
        type: 'bar',
        data: { labels: ORDEN_SEM.map(function (d) { return DSEM_C[d]; }), datasets: [{ label: 'Venta media', data: pm, backgroundColor: alfa(C.azul, 0.85), borderRadius: 6, maxBarThickness: 34 }] },

    /* 6. Distribución */

    /* 9. Relación tráfico-venta */
    var xs = [], ys = [], pts = [];
    for (i = w.a; i <= w.b; i++) if (v[i] > 0 && P.tk[i] > 0) { xs.push(P.tk[i]); ys.push(v[i]); pts.push({ x: P.tk[i], y: v[i], f: P.fechas[i] }); }

          { label: 'Recta de regresión', type: 'line', data: linea, borderColor: C.naranja, pointRadius: 0, pointHoverRadius: 0, borderWidth: 2 }

  }

  /* Reparto convenio / farmacia de hoy hasta ahora (del modo json). Vacío si no hay dato. */
  function repartoHoy() {
    var hoy = S.hoy && S.hoy.convenio;

      '<div class="l"><span><i class="hpunto" style="background:' + C.azul + '"></i>Farmacia · ' + pct(100 - pc) + '</span><b>' + usd(fh) + '<span class="s">' + tks(tkF) + '</span></b></div></div>';
  }

  function seccionConvenio(G, w, act, ant) {
