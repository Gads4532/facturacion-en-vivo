<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Facturación de hoy</title>
<style>
  :root { --tinta:#1F1F22; --sec:#6B6B72; --borde:#ECECEF; --azul:#194AD1; --verde:#0E7A3F; --rojo:#C2002F; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; color:var(--tinta); font-family:Montserrat,'Segoe UI',Arial,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 40px; }
  .cab { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--sec); }
  .estado { display:flex; align-items:center; gap:6px; }
  .punto { width:8px; height:8px; border-radius:50%; background:var(--verde); }
  .punto.error { background:var(--rojo); }
  .total { font-size:60px; font-weight:800; line-height:1; margin:4px 0 8px; font-variant-numeric:tabular-nums; }
  .chico { font-size:14px; color:var(--sec); line-height:1.5; }
  .comp { font-size:15px; margin-top:16px; }
  .mas { color:var(--verde); font-weight:700; }
  .menos { color:var(--rojo); font-weight:700; }
  .barra { height:4px; border-radius:2px; background:var(--borde); margin-top:8px; overflow:hidden; }
  .barra > i { display:block; height:100%; background:var(--azul); }
  .lista { margin-top:36px; }
  .fila { padding:14px 0; border-top:1px solid var(--borde); }
  .fila .a { display:flex; justify-content:space-between; gap:12px; font-size:16px; }
  .fila .a b { font-variant-numeric:tabular-nums; }
  .fila .chico { font-size:13px; margin-top:2px; }
  .aviso { margin-top:20px; font-size:14px; color:var(--rojo); display:none; }
  .pie { margin-top:28px; font-size:12px; color:var(--sec); }
  @media (max-width:360px) { .total { font-size:48px; } }
</style>
</head>
<body>
<main>
  <div class="cab"><span id="fecha">Facturación de hoy</span>
    <span class="estado"><span class="punto" id="punto"></span><span id="estado">cargando…</span></span></div>
  <div class="aviso" id="aviso"></div>
  <div id="contenido"></div>
  <div class="pie">Datos de Plade · con IVA · se actualiza solo cada 2 minutos</div>
</main>
<script>
  // Dirección de la app web de Apps Script (modo datos). La clave va en el link después de #k= y nunca llega a GitHub.
  var API = 'https://script.google.com/macros/s/AKfycbyBAqww70el0Vcrl-6SbSuQYJ7-CoPuhq3YRMWZXV7xk3mMxPBKv1pbwheMi2lDGtrc1Q/exec';
  var CADA = 120000;
  var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

  function usd(x, dec) {
    var d = dec ? 2 : 0;
    return '$' + Number(x || 0).toLocaleString('es-VE', { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function ent(x) { return Number(x || 0).toLocaleString('es-VE', { maximumFractionDigits: 0 }); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fechaCorta(iso) { var d = new Date(iso + 'T12:00:00'); return DIAS[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1); }

  // «$8.228 más (+67 %) que todo el viernes pasado» o «faltan $681 (−31 %) para igualar el viernes pasado»
  function comparar(hoy, antes, dia) {
    if (!antes) return '';
    var v = Math.round((hoy - antes) / antes * 100);
    if (hoy >= antes) return '<span class="mas">' + usd(hoy - antes) + ' más (+' + ent(v) + ' %)</span> que todo el ' + dia + ' pasado';
    return 'faltan <span class="menos">' + usd(antes - hoy) + ' (−' + ent(-v) + ' %)</span> para igualar el ' + dia + ' pasado';
  }
  function barra(hoy, antes) {
    return antes ? '<div class="barra"><i style="width:' + Math.min(100, Math.round(hoy / antes * 100)) + '%"></i></div>' : '';
  }

  function pintar(d) {
    var dia = d.diaSem, si = d.sinIva, h = [];
    document.getElementById('fecha').textContent = 'Facturación de hoy · ' + fechaCorta(d.hoy);
    h.push('<div class="chico" style="margin-top:28px">Vendido hoy' + (d.conIva ? ' · con IVA' : '') + '</div>');
    h.push('<div class="total">' + usd(d.venta) + '</div>');
    h.push('<div class="chico">' + (si ? 'Sin IVA ' + usd(si.venta) + ' · ' : '') + ent(d.tk) + ' tickets · ticket ' +
           usd(d.ticket, true) + '</div>');
    h.push('<div class="comp">' + comparar(d.venta, d.semVenta, dia) + '</div>' + barra(d.venta, d.semVenta));
    h.push('<div class="chico" style="margin-top:12px">Mes: ' + usd(d.mes) + (si ? ' · sin IVA ' + usd(si.mes) : '') + '</div>');
    h.push('<div class="lista">');
    d.filas.forEach(function (f) {
      h.push('<div class="fila"><div class="a"><span>' + esc(f.nombre) + '</span><b>' + usd(f.venta) + '</b></div>' +
             '<div class="chico">' + (comparar(f.venta, f.sem, dia) || 'sin ventas el ' + dia + ' pasado') + '</div>' +
             '<div class="chico">' + ent(f.tk) + ' tickets' + (si ? ' · sin IVA ' + usd(f.sinIva) : '') + '</div>' +
             barra(f.venta, f.sem) + '</div>');
    });
    if (!d.filas.length) h.push('<div class="fila chico">Todavía no hay ventas hoy.</div>');
    h.push('</div>');
    document.getElementById('contenido').innerHTML = h.join('');
    document.getElementById('punto').className = 'punto';
    document.getElementById('estado').textContent = 'actualizado ' + d.hora;
    document.getElementById('aviso').style.display = 'none';
  }

  function fallo(err) {
    document.getElementById('punto').className = 'punto error';
    document.getElementById('estado').textContent = 'sin conexión';
    var a = document.getElementById('aviso');
    a.textContent = 'No pude traer los datos: ' + ((err && err.message) || err) + '. Reintento en 2 minutos.';
    a.style.display = 'block';
  }

  // La clave se lee en cada consulta (si se cambia lo que va después de #k= sin recargar, se usa la nueva).
  function clave() {
    var m = location.hash.match(/k=([^&]+)/) || location.search.match(/k=([^&]+)/);
    var k = m ? m[1] : '';
    try { k = decodeURIComponent(k); } catch (e) {}
    return k.replace(/[^0-9a-zA-Z]/g, '');
  }

  function cargar() {
    if (window.DATOS_PRUEBA) { pintar(window.DATOS_PRUEBA); return; }
    var CLAVE = clave();
    if (!CLAVE) { fallo('el link no trae la clave; usa el botón del reporte diario'); return; }
    fetch(API + '?formato=json&k=' + encodeURIComponent(CLAVE), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (r) { if (r && r.ok) pintar(r.datos); else fallo(r && r.error === 'Link no válido' ? 'el link no es válido' : (r && r.error) || 'sin respuesta'); })
      .catch(function (err) { fallo(err); });
  }
  cargar();
  setInterval(cargar, CADA);
  window.addEventListener('hashchange', cargar);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) cargar(); });
</script>
</body>
</html>
